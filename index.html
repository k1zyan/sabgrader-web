<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SABGRADER</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #07080d;
      --card: #0e111a;
      --card-2: #141825;
      --border: #22283d;
      --text: #f4f6fb;
      --muted: #7c849e;
      --cyan: #00f0ff;
      --orange: #ff7b00;
      --green: #00f58d;
      --red: #ff2e55;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Inter, system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); min-height: 100dvh; display: flex; flex-direction: column; overflow-x: hidden; user-select: none; }
    .topbar { position: sticky; top: 0; z-index: 20; display: flex; justify-content: space-between; align-items: center; padding: clamp(10px, 2vw, 16px) clamp(14px, 4vw, 28px); background: rgba(11, 14, 22, 0.9); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); }
    .brand { font-weight: 900; font-size: clamp(16px, 2.4vw, 22px); letter-spacing: 2px; text-shadow: 0 0 14px rgba(0, 240, 255, 0.35); }
    .balance { display: flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 10px; background: rgba(0, 240, 255, 0.09); border: 1px solid rgba(0, 240, 255, 0.38); box-shadow: 0 0 16px rgba(0, 240, 255, 0.14); color: var(--cyan); font-weight: 800; font-size: clamp(13px, 1.8vw, 16px); }
    .coin { width: 16px; height: 16px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 10px; font-weight: 900; color: #160d00; background: radial-gradient(circle at 30% 30%, #ffe875, #ff9900); box-shadow: 0 0 8px rgba(255, 165, 0, 0.55); flex-shrink: 0; }
    .wrap { flex: 1; width: 100%; max-width: 1040px; margin: 0 auto; padding: clamp(14px, 3vw, 28px) clamp(12px, 3vw, 24px) 96px; }
    .view { display: none; }
    .view.active { display: block; animation: fadeIn 0.2s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    .heading { font-size: clamp(16px, 2.2vw, 22px); font-weight: 800; letter-spacing: 0.8px; text-transform: uppercase; margin-bottom: 16px; }
    .cases-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: clamp(10px, 2vw, 18px); }
    .case-card { background: linear-gradient(180deg, var(--card-2), var(--card)); border: 1px solid var(--border); border-radius: 16px; padding: clamp(12px, 2vw, 18px); display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: transform 0.14s, border-color 0.2s, box-shadow 0.2s; }
    .case-card:hover { border-color: var(--cyan); box-shadow: 0 0 22px rgba(0, 240, 255, 0.16); }
    .case-card:active { transform: scale(0.97); }
    .case-art { width: 100%; height: clamp(92px, 14vw, 136px); display: grid; place-items: center; margin-bottom: 10px; }
    .case-art img { max-width: 82%; max-height: 82%; object-fit: contain; filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.7)); }
    .case-name { font-weight: 800; font-size: clamp(14px, 1.8vw, 16px); margin-bottom: 8px; }
    .case-price { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 8px; background: rgba(0, 240, 255, 0.1); border: 1px solid rgba(0, 240, 255, 0.3); color: var(--cyan); font-weight: 800; font-size: 13px; }
    .upg-layout { display: grid; grid-template-columns: 1fr; gap: 20px; align-items: center; justify-items: center; }
    @media (min-width: 760px) { .upg-layout { grid-template-columns: minmax(320px, 380px) 1fr; gap: 28px; } }
    .ring-box { position: relative; width: clamp(260px, 68vw, 330px); height: clamp(260px, 68vw, 330px); display: grid; place-items: center; }
    #upg-canvas { width: 100%; height: 100%; display: block; }
    .ring-center { position: absolute; width: 56%; height: 56%; border-radius: 50%; background: radial-gradient(circle, #151926 0%, #090b11 100%); border: 1px solid #262c42; box-shadow: inset 0 0 22px rgba(0, 0, 0, 0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; z-index: 2; }
    .upg-pct { font-size: clamp(26px, 4.5vw, 38px); font-weight: 900; text-shadow: 0 0 16px rgba(255, 255, 255, 0.3); }
    .upg-sub { font-size: 10px; font-weight: 800; letter-spacing: 1.6px; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
    .marker-orbit { position: absolute; inset: 0; pointer-events: none; z-index: 4; transform: rotate(0deg); }
    .marker-tip { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-top: 16px solid var(--orange); filter: drop-shadow(0 0 8px var(--orange)) drop-shadow(0 0 16px rgba(255, 123, 0, 0.8)); }
    .upg-panel { width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: clamp(14px, 2.5vw, 20px); display: flex; flex-direction: column; gap: 14px; }
    .slots { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .slot { height: 112px; border-radius: 12px; border: 1px dashed #2d344c; background: var(--card-2); padding: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: border-color 0.2s, box-shadow 0.2s; }
    .slot:hover { border-color: var(--cyan); box-shadow: inset 0 0 14px rgba(0, 240, 255, 0.08); }
    .slot.filled { border-style: solid; border-color: rgba(0, 240, 255, 0.42); }
    .slot img { width: 46px; height: 46px; object-fit: contain; margin-bottom: 5px; }
    .slot-title { font-size: 12px; font-weight: 700; color: var(--muted); text-align: center; }
    .slot.filled .slot-title { color: var(--text); max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .slot-price { font-size: 11px; font-weight: 800; color: var(--cyan); margin-top: 2px; display: inline-flex; align-items: center; gap: 4px; }
    .btn-main { width: 100%; padding: 15px; border-radius: 12px; border: none; cursor: pointer; background: linear-gradient(90deg, #0077ff, var(--cyan)); color: #040812; font-weight: 900; font-size: 14px; letter-spacing: 1.4px; text-transform: uppercase; box-shadow: 0 0 20px rgba(0, 240, 255, 0.32); transition: transform 0.14s, opacity 0.2s; }
    .btn-main:active:not(:disabled) { transform: scale(0.98); }
    .btn-main:disabled { background: #1a1e2c; color: #525973; box-shadow: none; cursor: not-allowed; }
    .inv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: clamp(10px, 1.8vw, 14px); }
    @media (min-width: 760px) { .inv-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); } }
    .inv-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 10px 8px; display: flex; flex-direction: column; align-items: center; }
    .inv-card img { width: 56px; height: 56px; object-fit: contain; margin-bottom: 6px; }
    .inv-name { font-size: 11px; font-weight: 700; text-align: center; height: 28px; line-height: 14px; overflow: hidden; margin-bottom: 4px; }
    .inv-price { font-size: 12px; font-weight: 800; color: var(--cyan); display: inline-flex; align-items: center; gap: 4px; margin-bottom: 8px; }
    .btn-sell-sm { width: 100%; padding: 6px; border-radius: 7px; border: 1px solid rgba(255, 46, 85, 0.42); background: rgba(255, 46, 85, 0.12); color: var(--red); font-size: 10px; font-weight: 800; cursor: pointer; }
    .nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; display: flex; justify-content: center; gap: clamp(8px, 4vw, 48px); padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px)); background: rgba(11, 14, 22, 0.95); backdrop-filter: blur(12px); border-top: 1px solid var(--border); }
    .nav-btn { background: none; border: none; color: var(--muted); font-size: 12px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; padding: 8px 14px; border-radius: 8px; cursor: pointer; transition: color 0.2s, text-shadow 0.2s; }
    .nav-btn.active { color: var(--cyan); text-shadow: 0 0 12px rgba(0, 240, 255, 0.45); }
    .modal { position: fixed; inset: 0; z-index: 100; display: none; align-items: center; justify-content: center; padding: 16px; background: rgba(5, 6, 10, 0.92); backdrop-filter: blur(8px); }
    .modal.open { display: flex; }
    .reel-shell { width: 100%; max-width: 620px; background: var(--card); border: 1px solid var(--cyan); box-shadow: 0 0 36px rgba(0, 240, 255, 0.2); border-radius: 16px; padding: 18px 0; position: relative; overflow: hidden; }
    .reel-line { position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; transform: translateX(-50%); background: var(--cyan); box-shadow: 0 0 14px var(--cyan); z-index: 5; }
    .reel-viewport { width: 100%; overflow: hidden; }
    .reel-track { display: flex; will-change: transform; }
    .reel-item { width: 110px; height: 110px; margin: 0 4px; border-radius: 12px; background: var(--card-2); border: 1px solid var(--border); flex-shrink: 0; display: grid; place-items: center; padding: 10px; }
    .reel-item img { width: 80px; height: 80px; object-fit: contain; }
    .dialog { width: 100%; max-width: 360px; background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 22px 18px; text-align: center; box-shadow: 0 0 36px rgba(0, 240, 255, 0.14); }
    .dialog img { width: 112px; height: 112px; object-fit: contain; margin: 0 auto 12px; display: block; }
    .dialog-title { font-size: 18px; font-weight: 800; margin-bottom: 6px; }
    .dialog-price { font-size: 15px; font-weight: 800; color: var(--cyan); display: inline-flex; align-items: center; gap: 6px; margin-bottom: 18px; }
    .dialog-btns { display: flex; gap: 10px; }
    .btn-red { flex: 1; padding: 13px 10px; border-radius: 12px; border: 1px solid var(--red); background: rgba(255, 46, 85, 0.14); color: var(--red); font-weight: 800; font-size: 12px; cursor: pointer; }
    .btn-cyan { flex: 1; padding: 13px 10px; border-radius: 12px; border: 1px solid var(--cyan); background: rgba(0, 240, 255, 0.14); color: var(--cyan); font-weight: 800; font-size: 12px; cursor: pointer; }
    .pick-list { max-height: 55dvh; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin: 12px 0 16px; }
    .pick-row { display: flex; align-items: center; gap: 12px; padding: 9px 10px; border-radius: 12px; background: var(--card-2); border: 1px solid var(--border); cursor: pointer; text-align: left; }
    .pick-row:hover { border-color: var(--cyan); }
    .pick-row img { width: 42px; height: 42px; object-fit: contain; }
    .pick-name { font-size: 13px; font-weight: 700; }
    .pick-price { font-size: 11px; font-weight: 800; color: var(--cyan); display: inline-flex; align-items: center; gap: 4px; margin-top: 2px; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">SABGRADER</div>
    <div class="balance"><span class="coin">B</span><span id="balance">250</span></div>
  </header>

  <main class="wrap">
    <section id="view-cases" class="view active">
      <div class="heading">Кейсы</div>
      <div id="cases-grid" class="cases-grid"></div>
    </section>

    <section id="view-upgrader" class="view">
      <div class="heading">Апгрейдер</div>
      <div class="upg-layout">
        <div class="ring-box">
          <canvas id="upg-canvas" width="600" height="600"></canvas>
          <div id="marker-orbit" class="marker-orbit"><div class="marker-tip"></div></div>
          <div class="ring-center">
            <div id="upg-pct" class="upg-pct">0.00%</div>
            <div id="upg-sub" class="upg-sub">ВЫБЕРИТЕ СТАВКУ И ЦЕЛЬ</div>
          </div>
        </div>
        <div class="upg-panel">
          <div class="slots">
            <div id="slot-stake" class="slot" onclick="openPicker('stake')"><div class="slot-title">Ваша ставка</div></div>
            <div id="slot-target" class="slot" onclick="openPicker('target')"><div class="slot-title">Желаемый предмет</div></div>
          </div>
          <button id="upg-run" class="btn-main" disabled onclick="runUpgrade()">УЛУЧШИТЬ</button>
        </div>
      </div>
    </section>

    <section id="view-inventory" class="view">
      <div class="heading">Инвентарь</div>
      <div id="inv-grid" class="inv-grid"></div>
    </section>
  </main>

  <nav class="nav">
    <button type="button" class="nav-btn active" onclick="setTab('cases', this)">Кейсы</button>
    <button type="button" class="nav-btn" onclick="setTab('upgrader', this)">Апгрейд</button>
    <button type="button" class="nav-btn" onclick="setTab('inventory', this)">Инвентарь</button>
  </nav>

  <div id="modal-reel" class="modal">
    <div class="reel-shell">
      <div class="reel-line"></div>
      <div class="reel-viewport"><div id="reel-track" class="reel-track"></div></div>
    </div>
  </div>

  <div id="modal-drop" class="modal">
    <div class="dialog">
      <img id="drop-img" src="" alt="" />
      <div id="drop-name" class="dialog-title"></div>
      <div class="dialog-price"><span class="coin">B</span><span id="drop-price"></span></div>
      <div class="dialog-btns">
        <button type="button" id="drop-sell" class="btn-red" onclick="takeDrop('sell')">Продать</button>
        <button type="button" class="btn-cyan" onclick="takeDrop('keep')">Оставить</button>
      </div>
    </div>
  </div>

  <div id="modal-pick" class="modal">
    <div class="dialog">
      <div id="pick-title" class="heading" style="margin-bottom:0;font-size:15px;">Выбор</div>
      <div id="pick-list" class="pick-list"></div>
      <button type="button" class="btn-main" style="background:#1c2130;color:#fff;box-shadow:none;" onclick="closePicker()">Закрыть</button>
    </div>
  </div>

  <script>
