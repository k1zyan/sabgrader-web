<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SABgrader</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #0b0b0e;
            --panel: #16161a;
            --panel-light: #202025;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --gold: #fbbf24;
            --text: #ffffff;
            --text-muted: #9ca3af;
            --success: #10b981;
            --danger: #ef4444;
            --border: #27272a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        
        body {
            background-color: var(--bg); color: var(--text);
            height: 100vh; display: flex; flex-direction: column;
            overflow: hidden; user-select: none; -webkit-user-select: none;
        }

        /* Header */
        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--border);
            z-index: 10;
        }
        .logo { font-weight: 800; font-size: 18px; letter-spacing: 0.5px; }
        .balance {
            background: rgba(251, 191, 36, 0.1); padding: 6px 12px; border-radius: 20px;
            display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 15px;
        }
        .coin-svg { width: 16px; height: 16px; fill: var(--gold); }

        /* Main Content */
        .main-content { flex: 1; overflow-y: auto; padding: 16px; padding-bottom: 80px; }
        .tab-pane { display: none; animation: fadeIn 0.2s ease-out; }
        .tab-pane.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* Cases Grid */
        .section-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; color: var(--text); }
        .cases-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .case-card {
            background: var(--panel); border-radius: 16px; padding: 12px;
            border: 1px solid var(--border); display: flex; flex-direction: column; align-items: center;
            transition: transform 0.1s, background 0.2s; cursor: pointer;
        }
        .case-card:active { transform: scale(0.96); background: var(--panel-light); }
        .case-img-placeholder {
            width: 100%; aspect-ratio: 1; background: var(--panel-light); border-radius: 12px;
            margin-bottom: 12px; display: flex; justify-content: center; align-items: center;
            color: var(--text-muted); font-size: 12px; border: 1px dashed var(--border);
        }
        .case-name { font-weight: 600; font-size: 15px; margin-bottom: 4px; }
        .case-price { display: flex; align-items: center; gap: 4px; color: var(--gold); font-weight: 700; font-size: 14px; }

        /* Upgrader */
        .upgrader-wrap { display: flex; flex-direction: column; align-items: center; margin-top: 20px; }
        .wheel-container { position: relative; width: 280px; height: 280px; margin-bottom: 40px; }
        
        /* Стрелка (неподвижная) */
        .wheel-arrow {
            position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
            width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent;
            border-top: 24px solid var(--text); z-index: 5; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
        }

        /* Колесо (крутится) */
        .wheel {
            width: 100%; height: 100%; border-radius: 50%;
            background: conic-gradient(
                var(--danger) 0deg 180deg, 
                var(--accent) 180deg 360deg
            );
            border: 8px solid var(--panel);
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            display: flex; justify-content: center; align-items: center;
            transition: transform 4s cubic-bezier(0.1, 0.8, 0.1, 1);
            transform: rotate(0deg);
        }

        .wheel-inner {
            width: 210px; height: 210px; background: var(--bg); border-radius: 50%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            border: 4px solid var(--panel); z-index: 2; box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }
        .upg-percent { font-size: 36px; font-weight: 800; line-height: 1; margin-bottom: 8px; }
        .upg-status { font-size: 12px; font-weight: 700; letter-spacing: 1px; color: var(--text-muted); text-transform: uppercase; }

        .upg-panel {
            width: 100%; background: var(--panel); border-radius: 16px; padding: 20px;
            border: 1px solid var(--border); text-align: center;
        }
        .upg-item-slot {
            background: var(--panel-light); border-radius: 12px; height: 60px;
            display: flex; justify-content: center; align-items: center;
            margin-bottom: 16px; color: var(--text-muted); font-size: 14px;
        }
        .btn-primary {
            background: var(--accent); color: #fff; border: none; border-radius: 12px;
            padding: 16px; width: 100%; font-size: 16px; font-weight: 700;
            transition: 0.2s; cursor: pointer;
        }
        .btn-primary:active { background: var(--accent-hover); transform: scale(0.98); }
        .btn-primary:disabled { background: var(--panel-light); color: var(--text-muted); cursor: not-allowed; }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed; bottom: 0; width: 100%; background: var(--panel);
            display: flex; justify-content: space-around; padding: 12px 0;
            border-top: 1px solid var(--border); padding-bottom: env(safe-area-inset-bottom, 12px);
            z-index: 10;
        }
        .nav-btn {
            background: none; border: none; color: var(--text-muted); font-size: 14px;
            font-weight: 600; cursor: pointer; padding: 8px 16px; border-radius: 8px; transition: 0.2s;
        }
        .nav-btn.active { color: var(--text); background: var(--panel-light); }

        /* Modal for Case Opening */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(4px);
            display: none; justify-content: center; align-items: center; z-index: 100;
            flex-direction: column; opacity: 0; transition: opacity 0.3s;
        }
        .modal-overlay.active { display: flex; opacity: 1; }
        
        .roulette-container {
            width: 100%; height: 120px; background: var(--panel);
            border-top: 2px solid var(--border); border-bottom: 2px solid var(--border);
            position: relative; overflow: hidden; margin-bottom: 30px;
        }
        .roulette-line {
            position: absolute; top: 0; left: 50%; width: 2px; height: 100%;
            background: var(--gold); transform: translateX(-50%); z-index: 2;
            box-shadow: 0 0 10px var(--gold);
        }
        .roulette-track {
            display: flex; align-items: center; height: 100%; padding-left: 50%;
            transition: transform 5s cubic-bezier(0.1, 1, 0.1, 1);
        }
        .roulette-item {
            min-width: 100px; height: 100px; background: var(--panel-light);
            margin: 0 10px; border-radius: 12px; border: 1px solid var(--border);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            flex-shrink: 0; font-size: 12px; font-weight: 600; padding: 10px; text-align: center;
        }
        .btn-close {
            background: var(--panel-light); color: #fff; border: none; padding: 12px 24px;
            border-radius: 12px; font-weight: 600; font-size: 16px; cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">SABgrader</div>
        <div class="balance">
            <svg class="coin-svg" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/></svg>
            <span id="balance">0</span>
        </div>
    </div>

    <div class="main-content">
        <!-- CASES TAB -->
        <div id="tab-cases" class="tab-pane active">
            <div class="section-title">Кейсы</div>
            <div class="cases-grid">
                <div class="case-card" onclick="openCaseModal('ДЛС', 229)">
                    <div class="case-img-placeholder">Ваша картинка</div>
                    <div class="case-name">ДЛС</div>
                    <div class="case-price">
                        <svg class="coin-svg" style="width:14px;height:14px;" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/></svg>
                        229
                    </div>
                </div>
                <div class="case-card" onclick="openCaseModal('Базовый', 9)">
                    <div class="case-img-placeholder">Ваша картинка</div>
                    <div class="case-name">Базовый</div>
                    <div class="case-price">
                        <svg class="coin-svg" style="width:14px;height:14px;" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/></svg>
                        9
                    </div>
                </div>
            </div>
        </div>

        <!-- UPGRADER TAB -->
        <div id="tab-upgrader" class="tab-pane">
            <div class="section-title">Апгрейдер</div>
            <div class="upgrader-wrap">
                <div class="wheel-container">
                    <div class="wheel-arrow"></div>
                    <div class="wheel" id="upg-wheel">
                        <div class="wheel-inner">
                            <div class="upg-percent" id="upg-percent">50%</div>
                            <div class="upg-status" id="upg-status">ШАНС</div>
                        </div>
                    </div>
                </div>
                
                <div class="upg-panel">
                    <div class="upg-item-slot">Предмет не выбран</div>
                    <button class="btn-primary" id="upg-btn" onclick="spinUpgrader()">Улучшить</button>
                </div>
            </div>
        </div>
    </div>

    <!-- BOTTOM NAV -->
    <div class="bottom-nav">
        <button class="nav-btn active" onclick="switchTab('cases', this)">Кейсы</button>
        <button class="nav-btn" onclick="switchTab('upgrader', this)">Апгрейд</button>
        <button class="nav-btn" onclick="switchTab('profile', this)">Профиль</button>
    </div>

    <!-- MODAL FOR CASE ROULETTE -->
    <div class="modal-overlay" id="case-modal">
        <div class="roulette-container">
            <div class="roulette-line"></div>
            <div class="roulette-track" id="roulette-track">
                <!-- Предметы будут добавлены через JS -->
            </div>
        </div>
        <button class="btn-close" onclick="closeCaseModal()">Закрыть</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.setHeaderColor('#16161a');
        tg.setBackgroundColor('#0b0b0e');

        // Haptic feedback helper
        function haptic(type = 'light') {
            if (tg.HapticFeedback) {
                if (type === 'light') tg.HapticFeedback.impactOccurred('light');
                if (type === 'medium') tg.HapticFeedback.impactOccurred('medium');
                if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
                if (type === 'error') tg.HapticFeedback.notificationOccurred('error');
            }
        }

        // Навигация
        function switchTab(tabId, btn) {
            haptic('light');
            document.querySelectorAll('.tab-pane').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(`tab-${tabId}`).classList.add('active');
            btn.classList.add('active');
        }

        // === ЛОГИКА АПГРЕЙДЕРА ===
        let isUpgrading = false;
        
        function spinUpgrader() {
            if (isUpgrading) return;
            isUpgrading = true;
            
            const btn = document.getElementById('upg-btn');
            const wheel = document.getElementById('upg-wheel');
            const percentText = document.getElementById('upg-percent');
            const statusText = document.getElementById('upg-status');
            
            btn.disabled = true;
            statusText.innerText = "ВРАЩЕНИЕ";
            statusText.style.color = "var(--text-muted)";
            haptic('medium');

            // Рандомим шанс от 5% до 95%
            const winChance = Math.floor(Math.random() * 90) + 5; 
            
            // Вычисляем угол: 360 градусов = 100%. 
            // Наш красный сектор (проигрыш) идет от 0 до 180 градусов.
            // Синий (успех) от 180 до 360.
            // Если шанс > 50, стрелка должна упасть в синюю зону.
            
            let targetAngle = 0;
            if (winChance > 50) {
                // Успех. Угол от 180 до 360.
                targetAngle = 180 + (winChance - 50) * (180 / 50);
            } else {
                // Проигрыш. Угол от 0 до 180.
                targetAngle = winChance * (180 / 50);
            }

            // Добавляем обороты (минимум 3 полных круга = 1080 градусов)
            const totalRotation = 1080 + (360 - targetAngle); 
            
            wheel.style.transform = `rotate(${totalRotation}deg)`;

            // Ждем окончания анимации (4 секунды как в CSS)
            setTimeout(() => {
                percentText.innerText = winChance + "%";
                if (winChance > 50) {
                    statusText.innerText = "УСПЕХ";
                    statusText.style.color = "var(--success)";
                    haptic('success');
                } else {
                    statusText.innerText = "ПРОИГРЫШ";
                    statusText.style.color = "var(--danger)";
                    haptic('error');
                }
                
                btn.disabled = false;
                isUpgrading = false;
                
                // Сбрасываем колесо для следующего раза без анимации
                setTimeout(() => {
                    wheel.style.transition = 'none';
                    wheel.style.transform = `rotate(0deg)`;
                    setTimeout(() => { wheel.style.transition = 'transform 4s cubic-bezier(0.1, 0.8, 0.1, 1)'; }, 50);
                }, 2000);

            }, 4000); // Таймаут должен совпадать с CSS transition
        }

        // === ЛОГИКА КЕЙСОВ (РУЛЕТКА) ===
        function openCaseModal(caseName, price) {
            haptic('medium');
            const modal = document.getElementById('case-modal');
            const track = document.getElementById('roulette-track');
            
            track.innerHTML = '';
            // Генерируем 50 рандомных предметов для прокрутки
            for (let i = 0; i < 50; i++) {
                const item = document.createElement('div');
                item.className = 'roulette-item';
                item.innerText = "Брейнрот #" + (Math.floor(Math.random() * 100) + 1);
                track.appendChild(item);
            }
            
            // Сбрасываем позицию
            track.style.transition = 'none';
            track.style.transform = 'translateX(0px)';
            modal.classList.add('active');
            
            // Запускаем анимацию через 100мс, чтобы DOM успел обновиться
            setTimeout(() => {
                // Прокручиваем на ~3000px (ширина 50 элементов по 120px)
                // И останавливаем на каком-то элементе
                const randomOffset = Math.floor(Math.random() * 200) - 100;
                track.style.transition = 'transform 4s cubic-bezier(0.1, 1, 0.1, 1)';
                track.style.transform = `translateX(-3000px) translateX(${randomOffset}px)`;
                
                setTimeout(() => {
                    haptic('success');
                }, 4000);
            }, 50);
        }

        function closeCaseModal() {
            haptic('light');
            document.getElementById('case-modal').classList.remove('active');
        }
    </script>
</body>
    </html>
