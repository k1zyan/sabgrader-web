<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SABgrader</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #050505;
            --panel: #101014;
            --panel-border: #22222a;
            --text: #ffffff;
            --text-muted: #888899;
            --neon-cyan: #00f0ff;
            --neon-magenta: #ff00ea;
            --neon-green: #00ff66;
            --neon-red: #ff0033;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        
        body {
            background-color: var(--bg); color: var(--text);
            height: 100vh; display: flex; flex-direction: column;
            overflow: hidden; user-select: none; -webkit-user-select: none;
        }

        /* --- HEADER --- */
        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 20px; background: var(--panel); 
            border-bottom: 1px solid var(--panel-border);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 10;
        }
        .logo { font-weight: 900; font-size: 20px; letter-spacing: 1px; color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.3); }
        .balance {
            background: rgba(0, 240, 255, 0.1); padding: 6px 14px; border-radius: 8px;
            display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px;
            color: var(--neon-cyan); border: 1px solid rgba(0, 240, 255, 0.3);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.1);
        }
        .coin-svg { width: 18px; height: 18px; fill: var(--neon-cyan); }

        /* --- MAIN CONTENT --- */
        .main-content { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 90px; }
        .tab-pane { display: none; animation: fadeIn 0.3s ease-out; }
        .tab-pane.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .section-title { font-size: 20px; font-weight: 800; margin-bottom: 20px; letter-spacing: 0.5px; }

        /* --- CASES --- */
        .cases-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .case-card {
            background: var(--panel); border-radius: 16px; padding: 15px;
            border: 1px solid var(--panel-border); display: flex; flex-direction: column; align-items: center;
            transition: transform 0.1s, box-shadow 0.2s; cursor: pointer;
        }
        .case-card:active { transform: scale(0.96); }
        .case-card:hover { box-shadow: 0 0 20px rgba(0, 240, 255, 0.15); border-color: rgba(0, 240, 255, 0.4); }
        .case-img-placeholder {
            width: 100%; aspect-ratio: 1; background: #181820; border-radius: 12px;
            margin-bottom: 15px; display: flex; justify-content: center; align-items: center;
            color: var(--text-muted); font-size: 12px; border: 1px dashed var(--panel-border);
        }
        .case-name { font-weight: 700; font-size: 16px; margin-bottom: 6px; }
        .case-price { display: flex; align-items: center; gap: 6px; color: var(--neon-cyan); font-weight: 800; font-size: 15px; }

        /* --- UPGRADER --- */
        .upgrader-wrap { display: flex; flex-direction: column; align-items: center; margin-top: 10px; }
        
        .wheel-container { position: relative; width: 300px; height: 300px; margin-bottom: 30px; }
        
        /* Колесо */
        .wheel-bg {
            width: 100%; height: 100%; border-radius: 50%; position: absolute;
            background: conic-gradient(
                var(--neon-red) 0deg 180deg, 
                var(--neon-green) 180deg 360deg
            );
            border: 4px solid #222;
            box-shadow: 0 0 30px rgba(0,0,0,0.8), inset 0 0 20px rgba(0,0,0,0.8);
        }
        .wheel-inner-mask {
            position: absolute; top: 15px; left: 15px; right: 15px; bottom: 15px;
            background: var(--bg); border-radius: 50%; z-index: 2;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            box-shadow: inset 0 0 20px rgba(0,0,0,1);
        }
        .upg-percent { font-size: 42px; font-weight: 900; line-height: 1; text-shadow: 0 0 15px rgba(255,255,255,0.5); }
        .upg-status { font-size: 14px; font-weight: 700; letter-spacing: 1.5px; color: var(--text-muted); text-transform: uppercase; margin-top: 5px; }

        /* Стрелка (Крутится) */
        .wheel-arrow {
            position: absolute; top: 50%; left: 50%; width: 8px; height: 140px;
            background: #fff; transform-origin: bottom center;
            transform: translate(-50%, -100%) rotate(0deg); z-index: 3;
            border-radius: 4px; box-shadow: 0 0 15px #fff;
            transition: transform 4s cubic-bezier(0.1, 0.8, 0.1, 1);
        }
        .wheel-arrow::after {
            content: ''; position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
            border-left: 10px solid transparent; border-right: 10px solid transparent;
            border-bottom: 15px solid #fff; filter: drop-shadow(0 0 5px #fff);
        }
        .wheel-center-dot {
            position: absolute; top: 50%; left: 50%; width: 24px; height: 24px;
            background: #fff; border-radius: 50%; transform: translate(-50%, -50%); z-index: 4;
            box-shadow: 0 0 15px #fff;
        }

        .upg-panel {
            width: 100%; background: var(--panel); border-radius: 16px; padding: 20px;
            border: 1px solid var(--panel-border); display: flex; flex-direction: column; gap: 15px;
        }
        .upg-slots { display: flex; justify-content: space-between; gap: 15px; }
        .upg-slot {
            flex: 1; background: #181820; border: 1px dashed var(--panel-border);
            border-radius: 12px; height: 100px; display: flex; flex-direction: column;
            justify-content: center; align-items: center; cursor: pointer; transition: 0.2s;
            position: relative; overflow: hidden;
        }
        .upg-slot:hover { border-color: var(--neon-cyan); }
        .upg-slot-img { width: 50px; height: 50px; object-fit: contain; margin-bottom: 5px; }
        .upg-slot-text { font-size: 12px; color: var(--text-muted); text-align: center; padding: 0 5px; }
        .upg-slot-val { font-size: 11px; color: var(--neon-cyan); font-weight: 700; margin-top: 2px; }
        
        .btn-primary {
            background: linear-gradient(90deg, #0055ff, var(--neon-cyan)); color: #000; border: none; border-radius: 12px;
            padding: 18px; width: 100%; font-size: 16px; font-weight: 800; letter-spacing: 1px;
            transition: 0.2s; cursor: pointer; box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
        }
        .btn-primary:active { transform: scale(0.98); }
        .btn-primary:disabled { background: #222; color: #555; box-shadow: none; cursor: not-allowed; }

        /* --- INVENTORY --- */
        .inv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 12px; }
        .inv-card {
            background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
            padding: 10px; display: flex; flex-direction: column; align-items: center; position: relative;
        }
        .inv-img { width: 60px; height: 60px; object-fit: contain; margin-bottom: 8px; }
        .inv-name { font-size: 11px; text-align: center; font-weight: 600; height: 28px; overflow: hidden; }
        .inv-price { font-size: 12px; color: var(--neon-cyan); font-weight: 800; margin-top: 5px; }

        /* --- BOTTOM NAV --- */
        .bottom-nav {
            position: fixed; bottom: 0; width: 100%; background: var(--panel);
            display: flex; justify-content: space-around; padding: 15px 0;
            border-top: 1px solid var(--panel-border); padding-bottom: env(safe-area-inset-bottom, 15px);
            z-index: 10; box-shadow: 0 -4px 15px rgba(0,0,0,0.5);
        }
        .nav-btn {
            background: none; border: none; color: var(--text-muted); font-size: 13px;
            font-weight: 800; cursor: pointer; padding: 8px 16px; border-radius: 8px; transition: 0.2s;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .nav-btn.active { color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.5); }

        /* --- MODALS --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); backdrop-filter: blur(5px);
            display: none; justify-content: center; align-items: center; z-index: 100;
            flex-direction: column; padding: 20px; opacity: 0; transition: opacity 0.3s;
        }
        .modal-overlay.active { display: flex; opacity: 1; }
        
        /* Case Roulette */
        .roulette-wrap {
            width: 100%; height: 140px; background: #111; border-radius: 12px;
            border: 1px solid var(--panel-border); position: relative; overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8); margin-bottom: 30px;
        }
        .roulette-center-line {
            position: absolute; top: 0; left: 50%; width: 2px; height: 100%;
            background: var(--neon-cyan); transform: translateX(-50%); z-index: 5;
            box-shadow: 0 0 15px var(--neon-cyan);
        }
        .roulette-track {
            display: flex; align-items: center; height: 100%; padding-left: calc(50% - 60px);
            transition: transform 6s cubic-bezier(0.1, 0.8, 0.1, 1);
        }
        .roulette-item {
            width: 120px; height: 110px; background: #181820; margin: 0 5px;
            border-radius: 8px; border: 1px solid #333; display: flex;
            justify-content: center; align-items: center; flex-shrink: 0; padding: 10px;
        }
        .roulette-item img { max-width: 100%; max-height: 100%; object-fit: contain; }

        /* Result Modal */
        .result-box {
            background: var(--panel); border-radius: 20px; padding: 30px 20px; width: 100%; max-width: 340px;
            text-align: center; border: 1px solid var(--panel-border);
            box-shadow: 0 0 50px rgba(0, 240, 255, 0.15); position: relative; overflow: hidden;
        }
        .result-img { width: 120px; height: 120px; object-fit: contain; margin: 0 auto 15px; filter: drop-shadow(0 0 15px rgba(255,255,255,0.2)); }
        .result-name { font-size: 20px; font-weight: 800; margin-bottom: 5px; }
        .result-price { font-size: 18px; color: var(--neon-cyan); font-weight: 800; margin-bottom: 25px; }
        .result-actions { display: flex; gap: 10px; }
        .btn-sell { background: rgba(255, 0, 51, 0.1); color: var(--neon-red); border: 1px solid var(--neon-red); flex: 1; padding: 15px; border-radius: 12px; font-weight: 800; cursor: pointer; transition: 0.2s; }
        .btn-sell:active { background: rgba(255, 0, 51, 0.3); }
        .btn-keep { background: rgba(0, 240, 255, 0.1); color: var(--neon-cyan); border: 1px solid var(--neon-cyan); flex: 1; padding: 15px; border-radius: 12px; font-weight: 800; cursor: pointer; transition: 0.2s; }
        .btn-keep:active { background: rgba(0, 240, 255, 0.3); }

        /* Selector Modal */
        .selector-list { width: 100%; max-height: 60vh; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .selector-item {
            background: #181820; border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px;
            display: flex; align-items: center; gap: 15px; cursor: pointer;
        }
        .selector-item:active { border-color: var(--neon-cyan); }
        .selector-item img { width: 40px; height: 40px; object-fit: contain; }
        .selector-info { flex: 1; text-align: left; }
        .selector-name { font-size: 14px; font-weight: 700; }
        .selector-price { font-size: 12px; color: var(--neon-cyan); font-weight: 700; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">SABGRADER</div>
        <div class="balance">
            <svg class="coin-svg" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>
            <span id="balance">1000</span>
        </div>
    </div>

    <div class="main-content">
        <!-- TAB CASES -->
        <div id="tab-cases" class="tab-pane active">
            <div class="section-title">Кейсы</div>
            <div class="cases-grid">
                <div class="case-card" onclick="startCase('Базовый', 9)">
                    <div class="case-img-placeholder">Картинка</div>
                    <div class="case-name">Базовый</div>
                    <div class="case-price">
                        <svg class="coin-svg" style="width:14px;height:14px;" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>
                        9
                    </div>
                </div>
                <div class="case-card" onclick="startCase('ДЛС', 229)">
                    <div class="case-img-placeholder">Картинка</div>
                    <div class="case-name">ДЛС</div>
                    <div class="case-price">
                        <svg class="coin-svg" style="width:14px;height:14px;" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>
                        229
                    </div>
                </div>
            </div>
        </div>

        <!-- TAB UPGRADER -->
        <div id="tab-upgrader" class="tab-pane">
            <div class="section-title">Апгрейдер</div>
            <div class="upgrader-wrap">
                <div class="wheel-container">
                    <div class="wheel-bg"></div>
                    <div class="wheel-inner-mask">
                        <div class="upg-percent" id="upg-percent">50%</div>
                        <div class="upg-status" id="upg-status">ШАНС</div>
                    </div>
                    <div class="wheel-arrow" id="upg-arrow"></div>
                    <div class="wheel-center-dot"></div>
                </div>
                
                <div class="upg-panel">
                    <div class="upg-slots">
                        <div class="upg-slot" id="slot-stake" onclick="openSelector('stake')">
                            <div class="upg-slot-text">Выбрать ставку</div>
                        </div>
                        <div class="upg-slot" id="slot-target" onclick="openSelector('target')">
                            <div class="upg-slot-text">Выбрать цель</div>
                        </div>
                    </div>
                    <button class="btn-primary" id="upg-btn" onclick="spinUpgrader()">УЛУЧШИТЬ</button>
                </div>
            </div>
        </div>

        <!-- TAB INVENTORY -->
        <div id="tab-inventory" class="tab-pane">
            <div class="section-title">Инвентарь</div>
            <div class="inv-grid" id="inv-grid">
                <!-- Предметы добавляются через JS -->
                <div style="grid-column: 1/-1; text-align: center; color: #666; margin-top: 20px;">Инвентарь пуст</div>
            </div>
        </div>
    </div>

    <!-- NAVIGATION -->
    <div class="bottom-nav">
        <button class="nav-btn active" onclick="switchTab('cases', this)">Кейсы</button>
        <button class="nav-btn" onclick="switchTab('upgrader', this)">Апгрейд</button>
        <button class="nav-btn" onclick="switchTab('inventory', this)">Инвентарь</button>
    </div>

    <!-- MODAL CASE ROULETTE -->
    <div class="modal-overlay" id="case-modal">
        <div class="roulette-wrap">
            <div class="roulette-center-line"></div>
            <div class="roulette-track" id="roulette-track"></div>
        </div>
    </div>

    <!-- MODAL CASE RESULT -->
    <div class="modal-overlay" id="result-modal">
        <div class="result-box">
            <img src="" id="res-img" class="result-img">
            <div class="result-name" id="res-name"></div>
            <div class="result-price" id="res-price"></div>
            <div class="result-actions">
                <button class="btn-sell" onclick="handleCaseResult('sell')">ПРОДАТЬ</button>
                <button class="btn-keep" onclick="handleCaseResult('keep')">ОСТАВИТЬ</button>
            </div>
        </div>
    </div>

    <!-- MODAL SELECTOR -->
    <div class="modal-overlay" id="selector-modal">
        <div class="result-box" style="padding: 20px;">
            <div class="section-title" style="font-size: 16px; margin-bottom: 15px;" id="selector-title">Выбор</div>
            <div class="selector-list" id="selector-list"></div>
            <button class="btn-primary" style="background: #333; color: #fff; box-shadow: none;" onclick="closeSelector()">ОТМЕНА</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.setHeaderColor('#101014');
        tg.setBackgroundColor('#050505');

        // --- БАЗА БРЕЙНРОТОВ (С твоих скринов) ---
        // Ссылки на картинки ведут на официальную вики (они не пропадут)
        const BRAINROTS = [
            { id: 1, name: "Noobini Pizzanini", price: 2050, img: "https://static.wikia.nocookie.net/stealabrainrot/images/e/e6/Noobini_Pizzanini.png" },
            { id: 2, name: "Lirili Larila", price: 20500, img: "https://static.wikia.nocookie.net/stealabrainrot/images/1/1a/Lirili_Larila.png" },
            { id: 3, name: "Tim Cheese", price: 41000, img: "https://static.wikia.nocookie.net/stealabrainrot/images/5/52/Tim_Cheese.png" },
            { id: 4, name: "Trippi Troppi", price: 164000, img: "https://static.wikia.nocookie.net/stealabrainrot/images/2/2b/Trippi_Troppi.png" },
            { id: 5, name: "Cappuccino Assassino", price: 820000, img: "https://static.wikia.nocookie.net/stealabrainrot/images/3/3c/Cappuccino_Assassino.png" },
            { id: 6, name: "Ballerina Cappuccina", price: 8200000, img: "https://static.wikia.nocookie.net/stealabrainrot/images/0/0e/Ballerina_Cappuccina.png" },
            { id: 7, name: "Matteo", price: 820000000, img: "https://static.wikia.nocookie.net/stealabrainrot/images/9/9f/Matteo.png" },
            { id: 8, name: "Hydra Dragon Cannon", price: 1281, img: "https://static.wikia.nocookie.net/stealabrainrot/images/d/d1/Hydra_Dragon_Cannon.png" },
            { id: 9, name: "Ginger Geratoni", price: 2064, img: "https://static.wikia.nocookie.net/stealabrainrot/images/e/e0/Ginger_Geratoni.png" },
            { id: 10, name: "La Supreme Combo", price: 2420, img: "https://static.wikia.nocookie.net/stealabrainrot/images/a/aa/La_Supreme_Combo.png" },
            { id: 11, name: "Arcadragon", price: 9408, img: "https://static.wikia.nocookie.net/stealabrainrot/images/a/a7/Arcadragon.png" },
            { id: 12, name: "Elefanto Frigo", price: 9562, img: "https://static.wikia.nocookie.net/stealabrainrot/images/8/88/Elefanto_Frigo.png" },
            { id: 13, name: "Cerberus", price: 163, img: "https://static.wikia.nocookie.net/stealabrainrot/images/6/6d/Cerberus.png" },
            { id: 14, name: "Los Admins", price: 389, img: "https://static.wikia.nocookie.net/stealabrainrot/images/3/3e/Los_Admins.png" },
            { id: 15, name: "Examen Bros", price: 393, img: "https://static.wikia.nocookie.net/stealabrainrot/images/c/cd/Examen_Bros.png" }
        ];

        // Состояние игры
        let state = {
            balance: 10000,
                        inventory: [], // Сюда падают предметы
            selectedStake: null,
            selectedTarget: null,
            currentCaseItem: null
        };

        // Инициализация
        function init() {
            updateBalanceUI();
            renderInventory();
        }

        // Навигация
        function switchTab(tabId, btn) {
            tg.HapticFeedback.impactOccurred('light');
            document.querySelectorAll('.tab-pane').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(`tab-${tabId}`).classList.add('active');
            btn.classList.add('active');
        }

        function updateBalanceUI() {
            document.getElementById('balance').innerText = state.balance.toLocaleString('ru-RU');
        }

        // --- ЛОГИКА КЕЙСОВ ---
        function startCase(caseName, price) {
            if (state.balance < price) {
                tg.showAlert("Недостаточно средств");
                return;
            }
            state.balance -= price;
            updateBalanceUI();
            tg.HapticFeedback.impactOccurred('medium');

            const modal = document.getElementById('case-modal');
            const track = document.getElementById('roulette-track');
            
            track.innerHTML = '';
            
            // Генерируем 60 рандомных предметов
            let items = [];
            for (let i = 0; i < 60; i++) {
                const randomItem = BRAINROTS[Math.floor(Math.random() * BRAINROTS.length)];
                items.push(randomItem);
                
                const el = document.createElement('div');
                el.className = 'roulette-item';
                // Картинка есть, Цены НЕТ (как просил)
                el.innerHTML = `<img src="${randomItem.img}" onerror="this.src='https://placehold.co/100x100/181820/ffffff?text=IMG'">`;
                track.appendChild(el);
            }

            // Выбираем выигрышный предмет (например, 55-й по счету)
            const winningIndex = 55;
            const winningItem = items[winningIndex];
            state.currentCaseItem = winningItem;

            modal.classList.add('active');
            
            // Сброс
            track.style.transition = 'none';
            track.style.transform = 'translateX(0px)';
            
            setTimeout(() => {
                // Ширина одного айтема 130px (120 + 10 margin)
                // Нам нужно, чтобы 55-й айтем оказался ровно по центру (50%)
                // 55 * 130 = 7150px.
                // Вычитаем половину экрана, чтобы центрировать, и добавляем рандом, чтобы не всегда в центр.
                const itemWidth = 130;
                const containerWidth = document.querySelector('.roulette-wrap').offsetWidth;
                const centerOffset = (containerWidth / 2) - (itemWidth / 2);
                const randomOffset = (Math.random() - 0.5) * 60; // Небольшой разброс
                
                const targetX = (winningIndex * itemWidth) - centerOffset + randomOffset;
                
                track.style.transition = 'transform 6s cubic-bezier(0.1, 0.8, 0.1, 1)';
                track.style.transform = `translateX(-${targetX}px)`;

                // Через 6 секунд показываем результат
                setTimeout(() => {
                    modal.classList.remove('active');
                    showCaseResult(winningItem);
                }, 6000);

            }, 50);
        }

        function showCaseResult(item) {
            tg.HapticFeedback.notificationOccurred('success');
            const resModal = document.getElementById('result-modal');
            document.getElementById('res-img').src = item.img;
            document.getElementById('res-name').innerText = item.name;
            document.getElementById('res-price').innerText = item.price.toLocaleString('ru-RU');
            resModal.classList.add('active');
        }

        function handleCaseResult(action) {
            tg.HapticFeedback.impactOccurred('light');
            const modal = document.getElementById('result-modal');
            modal.classList.remove('active');

            if (action === 'sell') {
                state.balance += state.currentCaseItem.price;
                updateBalanceUI();
            } else if (action === 'keep') {
                state.inventory.push(state.currentCaseItem);
                renderInventory();
            }
            state.currentCaseItem = null;
        }

        // --- ЛОГИКА ИНВЕНТАРЯ ---
        function renderInventory() {
            const grid = document.getElementById('inv-grid');
            grid.innerHTML = '';
            
            if (state.inventory.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #666; margin-top: 20px;">Инвентарь пуст</div>';
                return;
            }

            state.inventory.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'inv-card';
                card.innerHTML = `
                    <img src="${item.img}" class="inv-img" onerror="this.src='https://placehold.co/60x60/181820/ffffff?text=IMG'">
                    <div class="inv-name">${item.name}</div>
                    <div class="inv-price">${item.price.toLocaleString('ru-RU')}</div>
                    <button style="margin-top: 8px; background: rgba(255,0,51,0.2); color: #ff0033; border: none; padding: 5px; border-radius: 5px; font-size: 10px; font-weight: 700; cursor: pointer; width: 100%;" onclick="sellFromInventory(${index})">ПРОДАТЬ</button>
                `;
                grid.appendChild(card);
            });
        }

        function sellFromInventory(index) {
            tg.HapticFeedback.impactOccurred('light');
            const item = state.inventory[index];
            state.balance += item.price;
            state.inventory.splice(index, 1);
            updateBalanceUI();
            renderInventory();
        }

        // --- ЛОГИКА АПГРЕЙДЕРА ---
        function openSelector(type) {
            tg.HapticFeedback.impactOccurred('light');
            
            // Для ставки - только из инвентаря. Для цели - любые дороже ставки.
            let pool = [];
            if (type === 'stake') {
                pool = state.inventory;
                if (pool.length === 0) {
                    tg.showAlert("Инвентарь пуст");
                    return;
                }
            } else {
                if (!state.selectedStake) {
                    tg.showAlert("Сначала выберите предмет для ставки");
                    return;
                }
                // Цель должна быть дороже ставки
                pool = BRAINROTS.filter(b => b.price > state.selectedStake.price);
                if (pool.length === 0) {
                    tg.showAlert("Нет предметов дороже вашей ставки");
                    return;
                }
            }

            document.getElementById('selector-title').innerText = type === 'stake' ? 'Выберите ставку' : 'Выберите цель';
            const list = document.getElementById('selector-list');
            list.innerHTML = '';

            pool.forEach(item => {
                const div = document.createElement('div');
                div.className = 'selector-item';
                div.innerHTML = `
                    <img src="${item.img}" onerror="this.src='https://placehold.co/40x40/181820/ffffff?text=IMG'">
                    <div class="selector-info">
                        <div class="selector-name">${item.name}</div>
                        <div class="selector-price">${item.price.toLocaleString('ru-RU')} монет</div>
                    </div>
                `;
                div.onclick = () => selectItem(type, item);
                list.appendChild(div);
            });

            document.getElementById('selector-modal').classList.add('active');
            document.getElementById('selector-modal').dataset.type = type;
        }

        function closeSelector() {
            document.getElementById('selector-modal').classList.remove('active');
        }

        function selectItem(type, item) {
            tg.HapticFeedback.impactOccurred('light');
            closeSelector();
            
            const slotEl = document.getElementById(`slot-${type}`);
            slotEl.innerHTML = `
                <img src="${item.img}" class="upg-slot-img" onerror="this.src='https://placehold.co/50x50/181820/ffffff?text=IMG'">
                <div class="upg-slot-text" style="font-weight:700;color:#fff;">${item.name}</div>
                <div class="upg-slot-val">${item.price.toLocaleString('ru-RU')}</div>
            `;

            if (type === 'stake') {
                state.selectedStake = item;
                // Сбрасываем цель, если она стала дешевле новой ставки
                if (state.selectedTarget && state.selectedTarget.price <= item.price) {
                    state.selectedTarget = null;
                    document.getElementById('slot-target').innerHTML = '<div class="upg-slot-text">Выбрать цель</div>';
                }
            } else {
                state.selectedTarget = item;
            }

            calculateChance();
        }

        function calculateChance() {
            if (state.selectedStake && state.selectedTarget) {
                // Математика: Шанс = (Ставка / Цель) * 100
                let chance = (state.selectedStake.price / state.selectedTarget.price) * 100;
                
                // Ограничиваем шанс (например, от 2% до 90%)
                chance = Math.max(2, Math.min(90, chance));
                
                document.getElementById('upg-percent').innerText = Math.floor(chance) + "%";
                document.getElementById('upg-btn').disabled = false;
            } else {
                document.getElementById('upg-percent').innerText = "50%";
                document.getElementById('upg-btn').disabled = true;
            }
        }

        function spinUpgrader() {
            if (!state.selectedStake || !state.selectedTarget) return;

            const btn = document.getElementById('upg-btn');
            const arrow = document.getElementById('upg-arrow');
            const statusText = document.getElementById('upg-status');
            
            btn.disabled = true;
            statusText.innerText = "ВРАЩЕНИЕ";
            statusText.style.color = "var(--text-muted)";
            tg.HapticFeedback.impactOccurred('medium');

            const chance = parseFloat(document.getElementById('upg-percent').innerText);
            const win = Math.random() * 100 < chance; // True если выиграл

            // Рассчитываем угол
            // Красная зона (проигрыш) - сверху. Зеленая (выигрыш) - снизу.
            // Стрелка стоит на 0 градусов (смотрит вверх).
            let targetAngle = 0;
            
            if (win) {
                // Если выигрыш, стрелка должна упасть в зеленую зону (от 180 до 360)
                // Чем меньше шанс, тем ближе к 360 (краю) она падает
                const winAngleRange = 180; // Размер зеленой зоны
                targetAngle = 180 + Math.random() * winAngleRange;
            } else {
                // Если проигрыш, падает в красную зону (от 0 до 180)
                targetAngle = Math.random() * 180;
            }

            // Делаем 5 полных оборотов (5 * 360 = 1800) и добавляем финальный угол
            const totalRotation = 1800 + targetAngle;
            
            arrow.style.transform = `translate(-50%, -100%) rotate(${totalRotation}deg)`;

            setTimeout(() => {
                if (win) {
                    statusText.innerText = "УСПЕХ";
                    statusText.style.color = "var(--neon-green)";
                    tg.HapticFeedback.notificationOccurred('success');
                    
                    // Удаляем ставку из инвентаря
                    const stakeIndex = state.inventory.findIndex(i => i.id === state.selectedStake.id);
                    if (stakeIndex > -1) state.inventory.splice(stakeIndex, 1);
                    
                    // Добавляем цель
                    state.inventory.push(state.selectedTarget);
                    renderInventory();
                    
                    tg.showAlert(`Вы получили ${state.selectedTarget.name}`);
                } else {
                    statusText.innerText = "ПРОИГРЫШ";
                    statusText.style.color = "var(--neon-red)";
                    tg.HapticFeedback.notificationOccurred('error');
                    
                    // Удаляем ставку из инвентаря
                    const stakeIndex = state.inventory.findIndex(i => i.id === state.selectedStake.id);
                    if (stakeIndex > -1) state.inventory.splice(stakeIndex, 1);
                    renderInventory();
                    
                    tg.showAlert(`Предмет ${state.selectedStake.name} сгорел`);
                }

                // Сброс
                state.selectedStake = null;
                state.selectedTarget = null;
                document.getElementById('slot-stake').innerHTML = '<div class="upg-slot-text">Выбрать ставку</div>';
                document.getElementById('slot-target').innerHTML = '<div class="upg-slot-text">Выбрать цель</div>';
                document.getElementById('upg-percent').innerText = "50%";
                statusText.innerText = "ШАНС";
                statusText.style.color = "var(--text-muted)";
                btn.disabled = true;

                // Возвращаем стрелку без анимации
                setTimeout(() => {
                    arrow.style.transition = 'none';
                    arrow.style.transform = `translate(-50%, -100%) rotate(0deg)`;
                    setTimeout(() => { arrow.style.transition = 'transform 4s cubic-bezier(0.1, 0.8, 0.1, 1)'; }, 50);
                }, 2000);

            }, 4000); // Ждем окончания анимации стрелки
        }

        init();
    </script>
</body>
</html>
