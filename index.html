<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SABgrader</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f0f11;
            --panel-color: #1a1a1e;
            --gold: #e5b83b;
            --text: #ffffff;
            --text-muted: #888888;
            --btn-blue: #2ea6ff;
            --border: #2a2a30;
        }
        
        * { box-sizing: border-box; }
        
        body {
            margin: 0; padding: 0; background: var(--bg-color); color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex; flex-direction: column; height: 100vh; overflow: hidden;
            user-select: none;
        }
        
        /* Шапка */
        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 20px; background: var(--panel-color);
            border-bottom: 1px solid var(--border); font-weight: 600; font-size: 18px;
        }
        
        .balance { 
            color: var(--gold); display: flex; align-items: center; gap: 8px; 
            background: rgba(229, 184, 59, 0.1); padding: 5px 12px; border-radius: 20px;
        }
        
        /* Иконка монеты (заглушка, потом заменишь на свою) */
        .coin-icon { width: 20px; height: 20px; background: var(--gold); border-radius: 50%; }

        /* Контент */
        .content { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 90px; }
        .tab { display: none; }
        .tab.active { display: block; }
        
        h2 { font-size: 22px; margin-top: 0; margin-bottom: 20px; font-weight: 700; }

        /* Сетка кейсов */
        .cases-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        
        .case-card {
            background: var(--panel-color); border-radius: 16px; padding: 12px;
            text-align: center; border: 1px solid var(--border); transition: transform 0.1s;
            display: flex; flex-direction: column;
        }
        .case-card:active { transform: scale(0.97); }
        
        /* Место под твою картинку кейса */
        .case-img { 
            width: 100%; height: 120px; background: #25252b; border-radius: 12px; 
            margin-bottom: 12px; object-fit: cover;
        }
        
        .case-title { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
        .case-price { color: var(--gold); font-size: 14px; font-weight: 700; display: flex; justify-content: center; align-items: center; gap: 5px; }

        /* Апгрейдер */
        .upgrader-container {
            display: flex; flex-direction: column; align-items: center; margin-top: 30px;
        }
        
        .wheel-wrapper { position: relative; width: 260px; height: 260px; margin-bottom: 30px; }
        
        .wheel-container {
            width: 100%; height: 100%; border-radius: 50%; position: relative;
            background: conic-gradient(#ff4444 0deg 180deg, #4444ff 180deg 360deg);
            border: 10px solid #25252b; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            display: flex; justify-content: center; align-items: center;
        }
        
        .wheel-center {
            width: 210px; height: 210px; background: var(--panel-color);
            border-radius: 50%; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 2;
            border: 4px solid #111;
        }
        
        .wheel-text { font-size: 32px; font-weight: 800; margin-bottom: 5px; }
        .wheel-chance { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
        
        .pointer {
            width: 0; height: 0; border-left: 16px solid transparent;
            border-right: 16px solid transparent; border-bottom: 28px solid #fff;
            position: absolute; top: -15px; left: 50%; transform: translateX(-50%); z-index: 3;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }
        
        .action-panel {
            width: 100%; background: var(--panel-color); border-radius: 16px; padding: 20px;
            border: 1px solid var(--border); text-align: center;
        }
        
        .btn {
            background: var(--btn-blue); color: white; border: none; padding: 16px;
            border-radius: 12px; font-size: 16px; font-weight: 600; width: 100%;
            margin-top: 15px; transition: 0.2s; cursor: pointer;
        }
        .btn:active { background: #1c8cd9; transform: scale(0.98); }
        .btn:disabled { background: #333; color: #666; cursor: not-allowed; }

        /* Нижнее меню */
        .bottom-nav {
            position: fixed; bottom: 0; width: 100%; background: var(--panel-color);
            display: flex; justify-content: space-around; padding: 15px 0;
            border-top: 1px solid var(--border); padding-bottom: env(safe-area-inset-bottom, 15px);
        }
        .nav-item {
            color: var(--text-muted); font-size: 14px; font-weight: 600; cursor: pointer; 
            transition: 0.2s; text-transform: uppercase; letter-spacing: 0.5px;
        }
        .nav-item.active { color: var(--gold); }
    </style>
</head>
<body>

    <!-- Шапка -->
    <div class="header">
        <div>SABgrader</div>
        <div class="balance">
            <div class="coin-icon"></div>
            <span id="balance">0</span>
        </div>
    </div>

    <!-- Контент -->
    <div class="content">
        
        <!-- Вкладка Кейсы -->
        <div id="tab-cases" class="tab active">
            <h2>Кейсы</h2>
            <div class="cases-grid">
                
                <!-- Кейс 1 -->
                <div class="case-card" onclick="openCase('dls')">
                    <img src="" alt="DLS" class="case-img">
                    <div class="case-title">ДЛС</div>
                    <div class="case-price"><div class="coin-icon" style="width:14px; height:14px;"></div> 229</div>
                </div>
                
                <!-- Кейс 2 -->
                <div class="case-card" onclick="openCase('standard')">
                    <img src="" alt="Базовый" class="case-img">
                    <div class="case-title">Базовый</div>
                    <div class="case-price"><div class="coin-icon" style="width:14px; height:14px;"></div> 9</div>
                </div>

            </div>
        </div>

        <!-- Вкладка Апгрейдер -->
        <div id="tab-upgrader" class="tab">
            <h2>Апгрейдер</h2>
            <div class="upgrader-container">
                <div class="wheel-wrapper">
                    <div class="pointer"></div>
                    <div class="wheel-container" id="wheel">
                        <div class="wheel-center">
                            <div class="wheel-text" id="upg-text">50%</div>
                            <div class="wheel-chance" id="upg-status">ШАНС</div>
                        </div>
                    </div>
                </div>
                
                <div class="action-panel">
                    <div style="color: var(--text-muted); font-size: 14px; margin-bottom: 15px;">
                        Предмет не выбран
                    </div>
                    <button class="btn" id="upg-btn" onclick="upgradeItem()">Улучшить</button>
                </div>
            </div>
        </div>

    </div>

    <!-- Нижнее меню -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('cases', this)">Кейсы</div>
        <div class="nav-item" onclick="switchTab('upgrader', this)">Апгрейд</div>
        <div class="nav-item" onclick="switchTab('profile', this)">Профиль</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); 
        tg.setHeaderColor('#1a1a1e'); 
        tg.setBackgroundColor('#0f0f11');

        function switchTab(tabName, element) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            
            document.getElementById(`tab-${tabName}`).classList.add('active');
            element.classList.add('active');
        }

        function openCase(caseId) {
            tg.showAlert(`Открытие ${caseId}...`);
            // В будущем здесь будет отправка данных боту
            // tg.sendData(JSON.stringify({ action: 'open_case', case_id: caseId }));
        }

        function upgradeItem() {
            const btn = document.getElementById('upg-btn');
            const textEl = document.getElementById('upg-text');
            const statusEl = document.getElementById('upg-status');
            const wheel = document.getElementById('wheel');
            
            btn.disabled = true;
            statusEl.innerText = "ВРАЩЕНИЕ...";
            
            // Эмуляция анимации
            let counter = 0;
            const interval = setInterval(() => {
                textEl.innerText = Math.floor(Math.random() * 100) + "%";
                // Крутим фон
                wheel.style.transform = `rotate(${counter * 45}deg)`;
                counter++;
                
                if (counter > 15) {
                    clearInterval(interval);
                    const finalChance = Math.floor(Math.random() * 100);
                    textEl.innerText = finalChance + "%";
                    
                    if (finalChance > 50) {
                        statusEl.innerText = "УСПЕХ";
                        statusEl.style.color = "#4dff4d";
                    } else {
                        statusEl.innerText = "ПРОИГРЫШ";
                        statusEl.style.color = "#ff4d4d";
                    }
                    
                    btn.disabled = false;
                }
            }, 80);
        }
    </script>
</body>
</html>
