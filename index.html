<!DOCTYPE html>
<html lang="ru">

  <style>

      --orange: #ff7b00;
      --green: #00f58d;
      --red: #ff2e55;

    .brand { font-weight: 900; font-size: clamp(16px, 2.4vw, 22px); letter-spacing: 2px; text-shadow: 0 0 14px rgba(0, 240, 255, 0.35); }
    .balance { display: flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 10px; background: rgba(0, 240, 255, 0.09); border: 1px solid rgba(0, 240, 255, 0.38); box-shadow: 0 0 16px rgba(0, 240, 255, 0.14); color: var(--cyan); font-weight: 800; font-size: clamp(13px, 1.8vw, 16px); }
    .coin { width: 16px; height: 16px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 10px; font-weight: 900; color: #160d00; background: radial-gradient(circle at 30% 30%, #ffe875, #ff9900); box-shadow: 0 0 8px rgba(255, 165, 0, 0.55); flex-shrink: 0; }
    .wrap { flex: 1; width: 100%; max-width: 1040px; margin: 0 auto; padding: clamp(14px, 3vw, 28px) clamp(12px, 3vw, 24px) 96px; }
    .view { display: none; }
    .view.active { display: block; animation: fadeIn 0.2s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    .heading { font-size: clamp(16px, 2.2vw, 22px); font-weight: 800; letter-spacing: 0.8px; text-transform: uppercase; margin-bottom: 16px; }
    .cases-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: clamp(10px, 2vw, 18px); }
    .case-card { background: linear-gradient(180deg, var(--card-2), var(--card)); border: 1px solid var(--border); border-radius: 16px; padding: clamp(12px, 2vw, 18px); display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: transform 0.14s, border-color 0.2s, box-shadow 0.2s; }
    .case-card:hover { border-color: var(--cyan); box-shadow: 0 0 22px rgba(0, 240, 255, 0.16); }
    .case-card:active { transform: scale(0.97); }
    .case-art { width: 100%; height: clamp(92px, 14vw, 136px); display: grid; place-items: center; margin-bottom: 10px; }
    .case-art img { max-width: 82%; max-height: 82%; object-fit: contain; filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.7)); }
    .case-name { font-weight: 800; font-size: clamp(14px, 1.8vw, 16px); margin-bottom: 8px; }
    .case-price { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 8px; background: rgba(0, 240, 255, 0.1); border: 1px solid rgba(0, 240, 255, 0.3); color: var(--cyan); font-weight: 800; font-size: 13px; }
    .upg-layout { display: grid; grid-template-columns: 1fr; gap: 20px; align-items: center; justify-items: center; }
    @media (min-width: 760px) { .upg-layout { grid-template-columns: minmax(320px, 380px) 1fr; gap: 28px; } }
    .ring-box { position: relative; width: clamp(260px, 68vw, 330px); height: clamp(260px, 68vw, 330px); display: grid; place-items: center; }#upg-canvas { width: 100%; height: 100%; display: block; }
    .ring-center { position: absolute; width: 56%; height: 56%; border-radius: 50%; background: radial-gradient(circle, #151926 0%, #090b11 100%); border: 1px solid #262c42; box-shadow: inset 0 0 22px rgba(0, 0, 0, 0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; z-index: 2; }
    .upg-pct { font-size: clamp(26px, 4.5vw, 38px); font-weight: 900; text-shadow: 0 0 16px rgba(255, 255, 255, 0.3); }
    .upg-sub { font-size: 10px; font-weight: 800; letter-spacing: 1.6px; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
    .marker-orbit { position: absolute; inset: 0; pointer-events: none; z-index: 4; transform: rotate(0deg); }
    .marker-tip { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-top: 16px solid var(--orange); filter: drop-shadow(0 0 8px var(--orange)) drop-shadow(0 0 16px rgba(255, 123, 0, 0.8)); }
    .upg-panel { width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: clamp(14px, 2.5vw, 20px); display: flex; flex-direction: column; gap: 14px; }
    .slots { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .slot { height: 112px; border-radius: 12px; border: 1px dashed #2d344c; background: var(--card-2); padding: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: border-color 0.2s, box-shadow 0.2s; }
    .slot:hover { border-color: var(--cyan); box-shadow: inset 0 0 14px rgba(0, 240, 255, 0.08); }
    .slot.filled { border-style: solid; border-color: rgba(0, 240, 255, 0.42); }
    .slot img { width: 46px; height: 46px; object-fit: contain; margin-bottom: 5px; }
    .slot-title { font-size: 12px; font-weight: 700; color: var(--muted); text-align: center; }
    .slot.filled .slot-title { color: var(--text); max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .slot-price { font-size: 11px; font-weight: 800; color: var(--cyan); margin-top: 2px; display: inline-flex; align-items: center; gap: 4px; }
    .btn-main { width: 100%; padding: 15px; border-radius: 12px; border: none; cursor: pointer; background: linear-gradient(90deg, #0077ff, var(--cyan)); color: #040812; font-weight: 900; font-size: 14px; letter-spacing: 1.4px; text-transform: uppercase; box-shadow: 0 0 20px rgba(0, 240, 255, 0.32); transition: transform 0.14s, opacity 0.2s; }
    .btn-main:active:not(:disabled) { transform: scale(0.98); }
    .btn-main:disabled { background: #1a1e2c; color: #525973; box-shadow: none; cursor: not-allowed; }
    .inv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: clamp(10px, 1.8vw, 14px); }
    @media (min-width: 760px) { .inv-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); } }
    .inv-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 10px 8px; display: flex; flex-direction: column; align-items: center; }
    .inv-card img { width: 56px; height: 56px; object-fit: contain; margin-bottom: 6px; }
    .inv-name { font-size: 11px; font-weight: 700; text-align: center; height: 28px; line-height: 14px; overflow: hidden; margin-bottom: 4px; }
    .inv-price { font-size: 12px; font-weight: 800; color: var(--cyan); display: inline-flex; align-items: center; gap: 4px; margin-bottom: 8px; }
    .btn-sell-sm { width: 100%; padding: 6px; border-radius: 7px; border: 1px solid rgba(255, 46, 85, 0.42); background: rgba(255, 46, 85, 0.12); color: var(--red); font-size: 10px; font-weight: 800; cursor: pointer; }
    .nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; display: flex; justify-content: center; gap: clamp(8px, 4vw, 48px); padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px)); background: rgba(11, 14, 22, 0.95); backdrop-filter: blur(12px); border-top: 1px solidvar(--border); }
    .nav-btn { background: none; border: none; color: var(--muted); font-size: 12px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; padding: 8px 14px; border-radius: 8px; cursor: pointer; transition: color 0.2s, text-shadow 0.2s; }
    .nav-btn.active { color: var(--cyan); text-shadow: 0 0 12px rgba(0, 240, 255, 0.45); }
    .modal { position: fixed; inset: 0; z-index: 100; display: none; align-items: center; justify-content: center; padding: 16px; background: rgba(5, 6, 10, 0.92); backdrop-filter: blur(8px); }
    .modal.open { display: flex; }
    .reel-shell { width: 100%; max-width: 620px; background: var(--card); border: 1px solid var(--cyan); box-shadow: 0 0 36px rgba(0, 240, 255, 0.2); border-radius: 16px; padding: 18px 0; position: relative; overflow: hidden; }
    .reel-line { position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; transform: translateX(-50%); background: var(--cyan); box-shadow: 0 0 14px var(--cyan); z-index: 5; }
    .reel-viewport { width: 100%; overflow: hidden; }
    .reel-track { display: flex; will-change: transform; }
    .reel-item { width: 110px; height: 110px; margin: 0 4px; border-radius: 12px; background: var(--card-2); border: 1px solid var(--border); flex-shrink: 0; display: grid; place-items: center; padding: 10px; }
    .reel-item img { width: 80px; height: 80px; object-fit: contain; }
    .dialog { width: 100%; max-width: 360px; background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 22px 18px; text-align: center; box-shadow: 0 0 36px rgba(0, 240, 255, 0.14); }
    .dialog img { width: 112px; height: 112px; object-fit: contain; margin: 0 auto 12px; display: block; }
    .dialog-title { font-size: 18px; font-weight: 800; margin-bottom: 6px; }
    .dialog-price { font-size: 15px; font-weight: 800; color: var(--cyan); display: inline-flex; align-items: center; gap: 6px; margin-bottom: 18px; }
    .dialog-btns { display: flex; gap: 10px; }
    .btn-red { flex: 1; padding: 13px 10px; border-radius: 12px; border: 1px solid var(--red); background: rgba(255, 46, 85, 0.14); color: var(--red); font-weight: 800; font-size: 12px; cursor: pointer; }
    .btn-cyan { flex: 1; padding: 13px 10px; border-radius: 12px; border: 1px solid var(--cyan); background: rgba(0, 240, 255, 0.14); color: var(--cyan); font-weight: 800; font-size: 12px; cursor: pointer; }
    .pick-list { max-height: 55dvh; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin: 12px 0 16px; }
    .pick-row { display: flex; align-items: center; gap: 12px; padding: 9px 10px; border-radius: 12px; background: var(--card-2); border: 1px solid var(--border); cursor: pointer; text-align: left; }
    .pick-row:hover { border-color: var(--cyan); }
    .pick-row img { width: 42px; height: 42px; object-fit: contain; }
    .pick-name { font-size: 13px; font-weight: 700; }
    .pick-price { font-size: 11px; font-weight: 800; color: var(--cyan); display: inline-flex; align-items: center; gap: 4px; margin-top: 2px; }

</head>
<body>
  <header class="topbar">
    <div class="brand">SABGRADER</div>
    <div class="balance"><span class="coin">B</span><span id="balance">250</span></div>
  </header>

  <main class="wrap">
    <section id="view-cases" class="view active">
      <div class="heading">Кейсы</div>
      <div id="cases-grid" class="cases-grid"></div>
    </section>

    <section id="view-upgrader" class="view">
      <div class="heading">Апгрейдер</div>
      <div class="upg-layout">
        <div class="ring-box">
          <canvas id="upg-canvas" width="600" height="600"></canvas>
          <div id="marker-orbit" class="marker-orbit"><div class="marker-tip"></div></div>
          <div class="ring-center">
            <div id="upg-pct" class="upg-pct">0.00%</div><div id="upg-sub" class="upg-sub">ВЫБЕРИТЕ СТАВКУ И ЦЕЛЬ</div>
          </div>
        </div>
        <div class="upg-panel">
          <div class="slots">
            <div id="slot-stake" class="slot" onclick="openPicker('stake')"><div class="slot-title">Ваша ставка</div></div>
            <div id="slot-target" class="slot" onclick="openPicker('target')"><div class="slot-title">Желаемый предмет</div></div>
          </div>
          <button id="upg-run" class="btn-main" disabled onclick="runUpgrade()">УЛУЧШИТЬ</button>
        </div>
      </div>
    </section>

    <section id="view-inventory" class="view">
      <div class="heading">Инвентарь</div>
      <div id="inv-grid" class="inv-grid"></div>
    </section>
  </main>

  <nav class="nav">
    <button type="button" class="nav-btn active" onclick="setTab('cases', this)">Кейсы</button>
    <button type="button" class="nav-btn" onclick="setTab('upgrader', this)">Апгрейд</button>
    <button type="button" class="nav-btn" onclick="setTab('inventory', this)">Инвентарь</button>
  </nav>

  <div id="modal-reel" class="modal">
    <div class="reel-shell">
      <div class="reel-line"></div>
      <div class="reel-viewport"><div id="reel-track" class="reel-track"></div></div>
    </div>
  </div>

  <div id="modal-drop" class="modal">
    <div class="dialog">
      <img id="drop-img" src="" alt="" />
      <div id="drop-name" class="dialog-title"></div>
      <div class="dialog-price"><span class="coin">B</span><span id="drop-price"></span></div>
      <div class="dialog-btns">
        <button type="button" id="drop-sell" class="btn-red" onclick="takeDrop('sell')">Продать</button>
        <button type="button" class="btn-cyan" onclick="takeDrop('keep')">Оставить</button>
      </div>
    </div>
  </div>

  <div id="modal-pick" class="modal">
    <div class="dialog">
      <div id="pick-title" class="heading" style="margin-bottom:0;font-size:15px;">Выбор</div>
      <div id="pick-list" class="pick-list"></div>
      <button type="button" class="btn-main" style="background:#1c2130;color:#fff;box-shadow:none;" onclick="closePicker()">Закрыть</button>

    };
    const imgSrc = (item) => wikiThumbs[item.id] || https://stealabrainrot.fandom.com/wiki/Special:FilePath/${item.wiki}.png;

    async function loadThumbs() {
      try {
        const titles = ITEMS.map(i => i.name).join('|');
        const r = await fetch(https://stealabrainrot.fandom.com/api.php?action=query&titles=${encodeURIComponent(titles)}&prop=pageimages&format=json&pithumbsize=240&origin=*);
        const data = await r.json();
        Object.values(data?.query?.pages || {}).forEach(p => {
          if (p.thumbnail?.source) {
            const found = ITEMS.find(i => i.name.toLowerCase() === p.title.toLowerCase());
            if (found) wikiThumbs[found.id] = p.thumbnail.source;

        });
        renderCases(); renderInventory(); updateUpgrader();
      } catch (_) {}

    const state = { balance: 250, inv: [], stakeIdx: null, target: null, drop: null, busy: false, rot: 0 };

    function save() {
      try { localStorage.setItem('sabgrader_v3', JSON.stringify({ balance: state.balance, inv: state.inv })); } catch (_) {}
    }
    function load() {
      try {
        const d = JSON.parse(localStorage.getItem('sabgrader_v3'));
        if (d) { state.balance = Number(d.balance) || 250; state.inv = Array.isArray(d.inv) ? d.inv : []; }
      } catch (_) {}
      setBalance(state.balance);
    }
    function setBalance(v) { state.balance = Math.max(0, Math.round(v)); document.getElementById('balance').textContent = state.balance.toLocaleString('ru-RU'); save(); }

      haptic('light');
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(view-${name}).classList.add('active');
      btn.classList.add('active');
      if (name === 'upgrader') drawRing(getChance(), '#ff7b00');
    }

    function renderCases() {
      const grid = document.getElementById('cases-grid');
      grid.innerHTML = '';
      CASES.forEach(c => {
        const cov = ITEMS.find(i => i.wiki === c.cover) || c.pool[0];
        const card = document.createElement('div');
        card.className = 'case-card';
        card.onclick = () => openCase(c.id);
        card.innerHTML = <div class="case-art"><img src="${imgSrc(cov)}" onerror="this.onerror=null;this.src='${fallbackImg(c.name)}'" alt=""></div><div class="case-name">${c.name}</div><div class="case-price"><span class="coin">B</span>${c.price}</div>;
        grid.appendChild(card);
      });
    }

    function pickWeighted(pool) {
      const w = pool.map(i => 1 / Math.pow(i.price, 1.15));
      const sum = w.reduce((a, b) => a + b, 0);
      let r = Math.random() * sum;
      for (let i = 0; i < pool.length; i++) { if (r < w[i]) return pool[i]; r -= w[i]; }
      return pool[0];
    }
    const CASES = [function openCase(id) {
      if (state.busy) return;
      const c = CASES.find(x => x.id === id);
      if (!c) return;
      if (state.balance < c.price) { tg?.showAlert ? tg.showAlert('Недостаточно монет') : alert('Недостаточно монет'); return; }
      state.busy = true;
      setBalance(state.balance - c.price);
      haptic('medium');

      const modal = document.getElementById('modal-reel');
      const track = document.getElementById('reel-track');
      track.innerHTML = '';

      const count = 66, winIdx = 56, list = [];
      for (let i = 0; i < count; i++) {
        const item = pickWeighted(c.pool);
        list.push(item);
        const el = document.createElement('div');
        el.className = 'reel-item';
        el.innerHTML = <img src="${imgSrc(item)}" onerror="this.onerror=null;this.src='${fallbackImg(item.name)}'" alt="">;
        track.appendChild(el);
      }
      state.drop = list[winIdx];

      track.style.transition = 'none';
      track.style.transform = 'translate3d(0,0,0)';
      modal.classList.add('open');
      void track.offsetWidth;

      const step = 118;
      const center = document.querySelector('.reel-viewport').clientWidth / 2 - step / 2;
      const jitter = (Math.random() - 0.5) * 76;
      const targetX = winIdx * step - center + jitter;

      requestAnimationFrame(() => {
        track.style.transition = 'transform 7s cubic-bezier(0.08, 0.85, 0.14, 1)';
        track.style.transform = translate3d(-${targetX}px,0,0);
      });

      setTimeout(() => {
        modal.classList.remove('open');
        state.busy = false;
        const item = state.drop;
        document.getElementById('drop-img').src = imgSrc(item);
        document.getElementById('drop-img').onerror = function() { this.onerror = null; this.src = fallbackImg(item.name); };
        document.getElementById('drop-name').textContent = item.name;
        document.getElementById('drop-price').textContent = item.price;
        document.getElementById('drop-sell').textContent = Продать за ${item.price};
        document.getElementById('modal-drop').classList.add('open');
        haptic('success');
      }, 7100);
    }

    function takeDrop(mode) {
      haptic('light');
      document.getElementById('modal-drop').classList.remove('open');
      if (!state.drop) return;
      if (mode === 'sell') setBalance(state.balance + state.drop.price);
      else { state.inv.push(state.drop); renderInventory(); save(); }
      state.drop = null;
    }

    function renderInventory() {
      const grid = document.getElementById('inv-grid');
      grid.innerHTML = '';
      if (!state.inv.length) {
        grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:var(--muted);padding:36px 0;font-size:13px;">Инвентарь пуст</div>';
        return;
      }
      state.inv.forEach((item, idx) => {
        const card = document.createElement('div');
        card.className = 'inv-card';
        card.innerHTML = <img src="${imgSrc(item)}" onerror="this.onerror=null;this.src='${fallbackImg(item.name)}'" alt=""><div class="inv-name">${item.name}</div><div class="inv-price"><span class="coin">B</span>${item.price}</div><button type="button" class="btn-sell-sm" onclick="sellInv(${idx})">Продать за ${item.price}</button>;
        grid.appendChild(card);
      });
    }

    function sellInv(idx) {
      if (state.busy) return;
      haptic('light');
      const item = state.inv[idx];
      if (!item) return;
      setBalance(state.balance + item.price);
      state.inv.splice(idx, 1);
      if (state.stakeIdx === idx) { state.stakeIdx = null; state.target = null; }
      else if (state.stakeIdx !== null && state.stakeIdx > idx) state.stakeIdx--;
      renderInventory(); updateUpgrader();
    }

    function drawRing(pct, color = '#ff7b00') {
      const cvs = document.getElementById('upg-canvas');
      const ctx = cvs.getContext('2d');
      const cx = cvs.width / 2, cy = cvs.height / 2;
      ctx.clearRect(0, 0, cvs.width, cvs.height);for (let i = 0; i < 72; i++) {
        const a = (i / 72) * Math.PI * 2 - Math.PI / 2;
        const major = i % 18 === 0;
        const r1 = 290, r2 = r1 - (major ? 18 : 10);
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(a) * r2, cy + Math.sin(a) * r2);
        ctx.lineTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1);
        ctx.strokeStyle = major ? 'rgba(255,255,255,0.45)' : 'rgba(255,255,255,0.14)';
        ctx.lineWidth = major ? 3 : 2;
        ctx.stroke();
      }

      const r = 226, w = 52;
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.strokeStyle = '#121622'; ctx.lineWidth = w; ctx.stroke();
      ctx.beginPath(); ctx.arc(cx, cy, r + w / 2, 0, Math.PI * 2); ctx.strokeStyle = '#252b42'; ctx.lineWidth = 2; ctx.stroke();
      ctx.beginPath(); ctx.arc(cx, cy, r - w / 2, 0, Math.PI * 2); ctx.strokeStyle = '#252b42'; ctx.lineWidth = 2; ctx.stroke();

      if (pct > 0) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + (pct / 100) * Math.PI * 2);
        ctx.strokeStyle = color; ctx.lineWidth = w; ctx.shadowColor = color; ctx.shadowBlur = 24;
        ctx.stroke();
        ctx.restore();
      }

      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.font = '700 17px Inter, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('0%', cx, cy - r);
      ctx.fillText('25%', cx + r, cy);
      ctx.fillText('50%', cx, cy + r);
      ctx.fillText('75%', cx - r, cy);
    }

    function getChance() {
      if (state.stakeIdx === null  !state.inv[state.stakeIdx]  !state.target) return 0;
      const raw = (state.inv[state.stakeIdx].price / state.target.price) * 100;
      return Math.max(1, Math.min(85, Number(raw.toFixed(2))));
    }

    function updateUpgrader() {
      const sSlot = document.getElementById('slot-stake');
      const tSlot = document.getElementById('slot-target');
      const stake = state.stakeIdx !== null ? state.inv[state.stakeIdx] : null;

      if (stake) {
        sSlot.classList.add('filled');
        sSlot.innerHTML = <img src="${imgSrc(stake)}" onerror="this.onerror=null;this.src='${fallbackImg(stake.name)}'" alt=""><div class="slot-title">${stake.name}</div><div class="slot-price"><span class="coin">B</span>${stake.price}</div>;
      } else { sSlot.classList.remove('filled'); sSlot.innerHTML = '<div class="slot-title">Ваша ставка</div>'; }

      if (state.target) {
        tSlot.classList.add('filled');
        tSlot.innerHTML = <img src="${imgSrc(state.target)}" onerror="this.onerror=null;this.src='${fallbackImg(state.target.name)}'" alt=""><div class="slot-title">${state.target.name}</div><div class="slot-price"><span class="coin">B</span>${state.target.price}</div>;
      } else { tSlot.classList.remove('filled'); tSlot.innerHTML = '<div class="slot-title">Желаемый предмет</div>'; }

      const pct = getChance();
      const pctEl = document.getElementById('upg-pct');
      const subEl = document.getElementById('upg-sub');
      pctEl.textContent = pct.toFixed(2) + '%';
      pctEl.style.color = '#fff';
      subEl.textContent = pct > 0 ? (pct < 25 ? 'НИЗКИЙ ШАНС' : pct < 55 ? 'СРЕДНИЙ ШАНС' : 'ВЫСОКИЙ ШАНС') : 'ВЫБЕРИТЕ СТАВКУ И ЦЕЛЬ';
      subEl.style.color = pct > 0 ? '#ff9d3b' : 'var(--muted)';
      document.getElementById('upg-run').disabled = pct <= 0;
      drawRing(pct, '#ff7b00');
    }

    function openPicker(type) {
      if (state.busy) return;
      haptic('light');
      const list = document.getElementById('pick-list');
      list.innerHTML = '';
      if (type === 'stake') {
        if (!state.inv.length) { tg?.showAlert ? tg.showAlert('Инвентарь пуст') : alert('Инвентарь пуст'); return; }
        document.getElementById('pick-title').textContent = 'Выберите ставку';state.inv.forEach((item, idx) => {
          const row = document.createElement('button');
          row.type = 'button'; row.className = 'pick-row';
          row.onclick = () => { state.stakeIdx = idx; if (state.target && state.target.price <= item.price) state.target = null; closePicker(); updateUpgrader(); };
          row.innerHTML = <img src="${imgSrc(item)}" onerror="this.onerror=null;this.src='${fallbackImg(item.name)}'" alt=""><div><div class="pick-name">${item.name}</div><div class="pick-price"><span class="coin">B</span>${item.price}</div></div>;
          list.appendChild(row);
        });
      } else {
        const stake = state.stakeIdx !== null ? state.inv[state.stakeIdx] : null;
        if (!stake) { tg?.showAlert ? tg.showAlert('Сначала выберите ставку') : alert('Сначала выберите ставку'); return; }
        const targets = ITEMS.filter(i => i.price > stake.price);
        if (!targets.length) { tg?.showAlert ? tg.showAlert('Нет предметов дороже ставки') : alert('Нет предметов дороже ставки'); return; }
        document.getElementById('pick-title').textContent = 'Выберите цель';
        targets.forEach(item => {
          const row = document.createElement('button');
          row.type = 'button'; row.className = 'pick-row';
          row.onclick = () => { state.target = item; closePicker(); updateUpgrader(); };
          row.innerHTML = <img src="${imgSrc(item)}" onerror="this.onerror=null;this.src='${fallbackImg(item.name)}'" alt=""><div><div class="pick-name">${item.name}</div><div class="pick-price"><span class="coin">B</span>${item.price}</div></div>;
          list.appendChild(row);
        });
      }
      document.getElementById('modal-pick').classList.add('open');
    }

    function closePicker() { document.getElementById('modal-pick').classList.remove('open'); }

    function runUpgrade() {
      const pct = getChance();
      if (state.busy || pct <= 0) return;
      state.busy = true;
      haptic('medium');
      document.getElementById('upg-run').disabled = true;
      document.getElementById('upg-sub').textContent = 'ВРАЩЕНИЕ';
      document.getElementById('upg-sub').style.color = 'var(--cyan)';

      const win = Math.random() * 100 < pct;
      const winDeg = (pct / 100) * 360;
      const deg = win ? Math.min(2, winDeg * 0.15) + Math.random() * Math.max(0.5, winDeg * 0.7) : winDeg + 2 + Math.random() * Math.max(1, 360 - winDeg - 4);
      const turns = Math.floor(state.rot / 360) * 360 + 2160;
      state.rot = turns + deg;

      const orbit = document.getElementById('marker-orbit');
      orbit.style.transition = 'transform 5.5s cubic-bezier(0.08, 0.85, 0.12, 1)';
      orbit.style.transform = rotate(${state.rot}deg);

      setTimeout(() => {
        const pctEl = document.getElementById('upg-pct');
        const subEl = document.getElementById('upg-sub');
        if (win) {
          haptic('success');
          pctEl.style.color = 'var(--green)';
          subEl.textContent = 'УСПЕХ'; subEl.style.color = 'var(--green)';
          drawRing(pct, '#00f58d');
          state.inv.splice(state.stakeIdx, 1, state.target);
        } else {
          haptic('error');
          pctEl.style.color = 'var(--red)';
          subEl.textContent = 'ПРОИГРЫШ'; subEl.style.color = 'var(--red)';
          drawRing(pct, '#ff2e55');
          state.inv.splice(state.stakeIdx, 1);
        }
        renderInventory(); save();

        setTimeout(() => {
          state.stakeIdx = null; state.target = null; state.busy = false;
          updateUpgrader();
        }, 1200);
      }, 5600);
    }

    load(); renderCases(); renderInventory(); updateUpgrader(); loadThumbs();
  </script>
</body>
</html>
