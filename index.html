<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SABGRADER</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root { --bg:#07080d; --card:#0e121b; --card2:#151a27; --bd:#23293e; --tx:#f4f6fb; --mu:#7d859f; --cy:#00f0ff; --or:#ff7b00; --ok:#00f58d; --no:#ff2e55; }
    * { box-sizing:border-box; margin:0; padding:0; font-family:Inter,system-ui,sans-serif; -webkit-tap-highlight-color:transparent; }
    body { background:var(--bg); color:var(--tx); min-height:100dvh; display:flex; flex-direction:column; overflow-x:hidden; user-select:none; }
    .top { position:sticky; top:0; z-index:20; display:flex; justify-content:space-between; align-items:center; padding:12px 18px; background:rgba(10,13,20,.92); backdrop-filter:blur(12px); border-bottom:1px solid var(--bd); }
    .logo { font-weight:900; letter-spacing:2px; font-size:clamp(16px,2.2vw,21px); text-shadow:0 0 14px rgba(0,240,255,.35); }
    .bal { display:flex; align-items:center; gap:7px; padding:6px 13px; border-radius:10px; background:rgba(0,240,255,.09); border:1px solid rgba(0,240,255,.35); color:var(--cy); font-weight:800; font-size:14px; }
    .bal img, .coin-ic { width:16px; height:16px; border-radius:50%; object-fit:contain; flex-shrink:0; }
    .wrap { flex:1; width:100%; max-width:1040px; margin:0 auto; padding:16px 14px 92px; }
    .view { display:none; } .view.active { display:block; animation:fi .22s ease; }
    @keyframes fi { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
    .h1 { font-size:clamp(16px,2.2vw,21px); font-weight:800; text-transform:uppercase; letter-spacing:.8px; margin-bottom:14px; }
    .grid-cases { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:clamp(10px,2vw,16px); }
    .c-card { background:linear-gradient(180deg,var(--card2),var(--card)); border:1px solid var(--bd); border-radius:16px; padding:14px; display:flex; flex-direction:column; align-items:center; cursor:pointer; transition:.18s; }
    .c-card:hover { border-color:var(--cy); box-shadow:0 0 20px rgba(0,240,255,.15); transform:translateY(-2px); }
    .c-card img { width:100%; height:clamp(90px,13vw,126px); object-fit:contain; margin-bottom:10px; }
    .c-name { font-weight:800; font-size:14px; margin-bottom:6px; }
    .c-pr { display:inline-flex; align-items:center; gap:5px; padding:4px 11px; border-radius:8px; background:rgba(0,240,255,.1); color:var(--cy); font-weight:800; font-size:13px; }
    .box-stage { position:relative; overflow:hidden; background:var(--card); border:1px solid var(--bd); border-radius:18px; padding:20px 16px; }
    .bg-spin { position:absolute; inset:-20%; display:grid; grid-template-columns:repeat(4,1fr); gap:14px; opacity:.18; filter:blur(6px); animation:bgRot 26s linear infinite; pointer-events:none; }
    .bg-spin img { width:100%; height:72px; object-fit:contain; }
    @keyframes bgRot { from{transform:rotate(0)} to{transform:rotate(360deg)} }
    .stage-in { position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; }
    .stage-hero { width:132px; height:132px; object-fit:contain; margin:8px 0 12px; filter:drop-shadow(0 8px 22px rgba(0,240,255,.25)); }
    .row-btns { display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin-bottom:14px; }
    .chip { padding:8px 13px; border-radius:10px; border:1px solid var(--bd); background:var(--card2); color:var(--tx); font-weight:800; font-size:12px; cursor:pointer; transition:.15s; }
    .chip.on { border-color:var(--cy); color:var(--cy); background:rgba(0,240,255,.12); }
    .btn { width:100%; max-width:420px; padding:14px; border-radius:12px; border:none; cursor:pointer; background:linear-gradient(90deg,#0077ff,var(--cy)); color:#040812; font-weight:900; font-size:14px; letter-spacing:1.2px; text-transform:uppercase; box-shadow:0 0 20px rgba(0,240,255,.3); transition:.15s; }
    .btn:active:not(:disabled){transform:scale(.98)} .btn:disabled{background:#1b2030;color:#555d78;box-shadow:none;cursor:not-allowed}
    .drop-list { width:100%; margin-top:20px; display:grid; grid-template-columns:repeat(auto-fill,minmax(108px,1fr)); gap:10px; }
    .d-item { background:rgba(21,26,39,.92); border:1px solid var(--bd); border-radius:12px; padding:8px; display:flex; flex-direction:column; align-items:center; }
    .d-item img { width:48px; height:48px; object-fit:contain; margin-bottom:5px; }
    .d-n { font-size:10px; font-weight:700; text-align:center; height:26px; overflow:hidden; }
    .d-p { font-size:11px; font-weight:800; color:var(--cy); display:inline-flex; align-items:center; gap:4px; }
    .upg { display:grid; grid-template-columns:1fr; gap:20px; align-items:center; justify-items:center; }
    @media(min-width:760px){ .upg{grid-template-columns:340px 1fr; gap:26px;} }
    .wheel { position:relative; width:clamp(260px,68vw,320px); height:clamp(260px,68vw,320px); display:grid; place-items:center; }
    #w-cvs { width:100%; height:100%; }
    .w-mid { position:absolute; width:56%; height:56%; border-radius:50%; background:radial-gradient(circle,#161b29,#080a10); border:1px solid #282f46; display:flex; flex-direction:column; align-items:center; justify-content:center; pointer-events:none; z-index:2; }
    .w-pct { font-size:clamp(24px,4vw,34px); font-weight:900; }
    .w-st { font-size:10px; font-weight:800; letter-spacing:1.4px; color:var(--mu); margin-top:4px; }
    .w-orb { position:absolute; inset:0; pointer-events:none; z-index:4; }
    .w-tip { position:absolute; top:14px; left:50%; transform:translateX(-50%); border-left:10px solid transparent; border-right:10px solid transparent; border-top:16px solid var(--or); filter:drop-shadow(0 0 10px var(--or)); }
    .panel { width:100%; background:var(--card); border:1px solid var(--bd); border-radius:16px; padding:16px; display:flex; flex-direction:column; gap:12px; }
    .slots { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .slot { height:104px; border-radius:12px; border:1px dashed #2e3650; background:var(--card2); padding:8px; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; transition:.18s; }
    .slot.on { border-style:solid; border-color:rgba(0,240,255,.45); }
    .slot img { width:42px; height:42px; object-fit:contain; margin-bottom:4px; }
    .slot-t { font-size:12px; font-weight:700; color:var(--mu); text-align:center; max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .slot.on .slot-t { color:var(--tx); }
    .inv-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(112px,1fr)); gap:10px; }
    @media(min-width:760px){ .inv-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));} }
    .inv-c { background:var(--card); border:1px solid var(--bd); border-radius:12px; padding:10px 8px; display:flex; flex-direction:column; align-items:center; }
    .inv-c img { width:54px; height:54px; object-fit:contain; margin-bottom:6px; }
    .sell-b { width:100%; margin-top:6px; padding:6px; border-radius:7px; border:1px solid rgba(255,46,85,.4); background:rgba(255,46,85,.12); color:var(--no); font-size:10px; font-weight:800; cursor:pointer; }
    .nav { position:fixed; left:0; right:0; bottom:0; z-index:25; display:flex; justify-content:center; gap:clamp(8px,4vw,44px); padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px)); background:rgba(10,13,20,.95); backdrop-filter:blur(12px); border-top:1px solid var(--bd); }
    .nbtn { background:none; border:none; color:var(--mu); font-size:12px; font-weight:800; letter-spacing:1px; text-transform:uppercase; padding:8px 12px; cursor:pointer; transition:.18s; }
    .nbtn.on { color:var(--cy); text-shadow:0 0 12px rgba(0,240,255,.4); }
    .mod { position:fixed; inset:0; z-index:100; display:none; align-items:center; justify-content:center; padding:16px; background:rgba(4,6,10,.9); backdrop-filter:blur(8px); }
    .mod.open { display:flex; animation:fi .2s ease; }
    .reel-box { width:100%; max-width:640px; background:var(--card); border:1px solid var(--cy); box-shadow:0 0 34px rgba(0,240,255,.2); border-radius:16px; padding:14px; display:flex; flex-direction:column; gap:10px; }
    .r-line-wrap { position:relative; overflow:hidden; border-radius:12px; background:#090c14; border:1px solid var(--bd); }
    .r-mid { position:absolute; top:0; bottom:0; left:50%; width:2px; transform:translateX(-50%); background:var(--cy); box-shadow:0 0 12px var(--cy); z-index:4; }
    .r-tr { display:flex; padding:8px 0; will-change:transform; }
    .r-it { width:96px; height:96px; margin:0 4px; border-radius:10px; background:var(--card2); border:1px solid var(--bd); flex-shrink:0; display:grid; place-items:center; padding:8px; }
    .r-it img { width:68px; height:68px; object-fit:contain; }
    .dlg { width:100%; max-width:360px; background:var(--card); border:1px solid var(--bd); border-radius:20px; padding:22px 18px; text-align:center; animation:popIn .26s cubic-bezier(.18,.89,.32,1.28); }
    @keyframes popIn { from{opacity:0;transform:scale(.88)} to{opacity:1;transform:scale(1)} }
    .dlg img { width:108px; height:108px; object-fit:contain; margin:0 auto 10px; display:block; }
    .act-row { display:flex; gap:10px; margin-top:16px; }
    .b-no { flex:1; padding:12px; border-radius:11px; border:1px solid var(--no); background:rgba(255,46,85,.14); color:var(--no); font-weight:800; font-size:12px; cursor:pointer; }
    .b-ok { flex:1; padding:12px; border-radius:11px; border:1px solid var(--cy); background:rgba(0,240,255,.14); color:var(--cy); font-weight:800; font-size:12px; cursor:pointer; }
    .plist { max-height:52dvh; overflow-y:auto; display:flex; flex-direction:column; gap:8px; margin:12px 0; }
    .prow { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 10px; border-radius:11px; background:var(--card2); border:1px solid var(--bd); cursor:pointer; text-align:left; color:var(--tx); }
    .prow:hover { border-color:var(--cy); }
    .prow-l { display:flex; align-items:center; gap:10px; min-width:0; }
    .prow img { width:40px; height:40px; object-fit:contain; flex-shrink:0; }
    .pct-b { padding:4px 8px; border-radius:8px; background:rgba(255,123,0,.15); border:1px solid rgba(255,123,0,.4); color:#ff9d3b; font-size:11px; font-weight:800; flex-shrink:0; }
  </style>
</head>
<body>
  <header class="top">
    <div class="logo">SABGRADER</div>
    <div class="bal"><img src="./assets/coin.png" onerror="this.style.display='none'" alt=""><span id="bal">300</span></div>
  </header>

  <main class="wrap">
    <section id="v-cases" class="view active">
      <div class="h1">Кейсы</div>
      <div id="cases-grid" class="grid-cases"></div>
      <div id="case-screen" style="display:none;margin-top:6px;"></div>
    </section>

    <section id="v-upg" class="view">
      <div class="h1">Апгрейдер</div>
      <div class="upg">
        <div class="wheel">
          <canvas id="w-cvs" width="600" height="600"></canvas>
          <div id="w-orb" class="w-orb"><div class="w-tip"></div></div>
          <div class="w-mid"><div id="w-pct" class="w-pct">0.00%</div><div id="w-st" class="w-st">ВЫБЕРИТЕ СТАВКУ</div></div>
        </div>
        <div class="panel">
          <div class="slots">
            <div id="sl-s" class="slot" onclick="openPick('stake')"><div class="slot-t">Выбрать ставку</div></div>
            <div id="sl-t" class="slot" onclick="openPick('target')"><div class="slot-t">Выбрать цель</div></div>
          </div>
          <div class="row-btns" style="margin-bottom:0;">
            <button type="button" id="upg-fast" class="chip" onclick="toggleUpgFast()">⚡ Фаст</button>
          </div>
          <button type="button" id="upg-go" class="btn" disabled onclick="spinUpg()">Улучшить</button>
        </div>
      </div>
    </section>

    <section id="v-inv" class="view">
      <div class="h1">Инвентарь</div>
      <div id="inv-grid" class="inv-grid"></div>
    </section>
  </main>

  <nav class="nav">
    <button type="button" class="nbtn on" onclick="tab('cases',this)">Кейсы</button>
    <button type="button" class="nbtn" onclick="tab('upg',this)">Апгрейд</button>
    <button type="button" class="nbtn" onclick="tab('inv',this)">Инвентарь</button>
  </nav>

  <div id="m-reel" class="mod"><div id="reel-box" class="reel-box"></div></div>
  <div id="m-drop" class="mod">
    <div class="dlg">
      <img id="d-img" src="" alt="">
      <div id="d-name" style="font-size:18px;font-weight:800;margin-bottom:6px;"></div>
      <div style="display:inline-flex;align-items:center;gap:6px;color:var(--cy);font-weight:800;"><img class="coin-ic" src="./assets/coin.png" onerror="this.style.display='none'" alt=""><span id="d-pr"></span></div>
      <div class="act-row">
        <button type="button" id="d-sell" class="b-no" onclick="takeDrop('sell')">Продать</button>
        <button type="button" class="b-ok" onclick="takeDrop('keep')">Оставить</button>
      </div>
    </div>
  </div>
  <div id="m-pick" class="mod">
    <div class="dlg">
      <div id="p-title" style="font-size:15px;font-weight:800;text-transform:uppercase;">Выбор</div>
      <div id="p-list" class="plist"></div>
      <button type="button" class="btn" style="background:#1c2132;color:#fff;box-shadow:none;" onclick="closePick()">Закрыть</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor('#0a0d14'); tg.setBackgroundColor('#07080d'); }

    const ITEMS = [
      {id:"esok_sekolah",name:"Esok Sekolah",wiki:"Esok_Sekolah",price:17},{id:"agarini_la_palini",name:"Agarini La Palini",wiki:"Agarini_La_Palini",price:23},
      {id:"abbysaloco",name:"Abbysaloco",wiki:"Abbysaloco",price:23},{id:"los_mobills",name:"Los Mobills",wiki:"Los_Mobills",price:24},
      {id:"rainbow_slap",name:"Rainbow Slap",wiki:"Rainbow_Slap",price:24},{id:"los_burritos",name:"Los Burritos",wiki:"Los_Burritos",price:25},
      {id:"los_puggles",name:"Los Puggles",wiki:"Los_Puggles",price:29},{id:"orcaledon",name:"Orcaledon",wiki:"Orcaledon",price:30},
      {id:"ketupat_kepat",name:"Ketupat Kepat",wiki:"Ketupat_Kepat",price:30},{id:"mieteteira",name:"Mieteteira Bicicleteira",wiki:"Mieteteira_Bicicleteira",price:30},
      {id:"los_candies",name:"Los Candies",wiki:"Los_Candies",price:32},{id:"demon_head",name:"Demon Head",wiki:"Demon_Head",price:32},
      {id:"lavadorito",name:"Lavadorito Spinito",wiki:"Lavadorito_Spinito",price:33},{id:"crystal_slap",name:"Crystal Slap",wiki:"Crystal_Slap",price:33},
      {id:"ying_yang_lamp",name:"Ying Yang Lamp",wiki:"Ying_Yang_Lamp",price:34},{id:"bloodmoon_slap",name:"Bloodmoon Slap",wiki:"Bloodmoon_Slap",price:35},
      {id:"cupid_wings",name:"Cupid Wings",wiki:"Cupid_Wings",price:36},{id:"los_tangcitos",name:"Los Tangcitos",wiki:"Los_Tangcitos",price:36},
      {id:"waverider",name:"Waverider",wiki:"Waverider",price:37},{id:"witch_broom",name:"Witch Broom",wiki:"Witch_Broom",price:40},
      {id:"blackhole_bomb",name:"Blackhole Bomb",wiki:"Blackhole_Bomb",price:40},{id:"mi_gatito",name:"Mi Gatito",wiki:"Mi_Gatito",price:41},
      {id:"camera_ramen",name:"Camera Ramen",wiki:"Camera_Ramen",price:41},{id:"ventollero",name:"Ventollero Pavon",wiki:"Ventollero_Pavon",price:44},
      {id:"yes_my_examine",name:"Yes My Examine",wiki:"Yes_My_Examine",price:44},{id:"los_primos",name:"Los Primos",wiki:"Los_Primos",price:45},
      {id:"air_strike",name:"Air Strike",wiki:"Air_Strike",price:45},{id:"candy_sentry",name:"Candy Sentry",wiki:"Candy_Sentry",price:46},
      {id:"los_planitos",name:"Los Planitos",wiki:"Los_Planitos",price:49},{id:"la_summer_grande",name:"La Summer Grande",wiki:"La_Summer_Grande",price:49},
      {id:"honey_honey_bear",name:"Honey Honey Bear",wiki:"Honey_Honey_Bear",price:51},{id:"garama",name:"Garama and Madundung",wiki:"Garama_and_Madundung",price:54},
      {id:"ketchuru",name:"Ketchuru and Musturu",wiki:"Ketchuru_and_Musturu",price:54},{id:"quesadilo",name:"Quesadilo Vampiro",wiki:"Quesadilo_Vampiro",price:55},
      {id:"cash_or_card",name:"Cash or Card",wiki:"Cash_or_Card",price:56},{id:"noodle_noodle",name:"Noodle Noodle P",wiki:"Noodle_Noodle",price:57},
      {id:"phantom_slap",name:"Phantom Slap",wiki:"Phantom_Slap",price:60},{id:"la_jolly_grande",name:"La Jolly Grande",wiki:"La_Jolly_Grande",price:69},
      {id:"sammyni_fattini",name:"Sammyni Fattini",wiki:"Sammyni_Fattini",price:74},{id:"eviledon",name:"Eviledon",wiki:"Eviledon",price:75},
      {id:"w_or_l",name:"W or L",wiki:"W_or_L",price:78},{id:"lava_blaster",name:"Lava Blaster",wiki:"Lava_Blaster",price:80},
      {id:"los_tictacs",name:"Los Tictacs",wiki:"Los_Tictacs",price:82},{id:"los_sweethearts",name:"Los Sweethearts",wiki:"Los_Sweethearts",price:84},
      {id:"john_doe",name:"John Doe",wiki:"John_Doe",price:84},{id:"pizza_and_ranch",name:"Pizza and Ranch",wiki:"Pizza_and_Ranch",price:84},
      {id:"los_jolly_comb",name:"Los Jolly Combination",wiki:"Los_Jolly_Combination",price:91},{id:"popcuru",name:"Popcuru and Fizzuru",wiki:"Popcuru_and_Fizzuru",price:92},
      {id:"los_mariachis",name:"Los Mariachis",wiki:"Los_Mariachis",price:92},{id:"quackini",name:"Quackini Snackini",wiki:"Quackini_Snackini",price:93},
      {id:"santas_sleigh",name:"Santas Sleigh",wiki:"Santas_Sleigh",price:93},{id:"la_secret_comb",name:"La Secret Combination",wiki:"La_Secret_Combination",price:95},
      {id:"celestial_pegasus",name:"Celestial Pegasus",wiki:"Celestial_Pegasus",price:98},{id:"scorpino_coaster",name:"Scorpino Coaster",wiki:"Scorpino_Coaster",price:98}
    ];

    const CASES = [
      {id:"gears",name:"Гирсы",price:28,img:"./assets/cases/gears.png",pool:ITEMS.filter(i=>i.price>=24&&i.price<=80)},
      {id:"bases",name:"Базы",price:20,img:"./assets/cases/bases.png",pool:ITEMS.filter(i=>i.price<=45)},
      {id:"garama",name:"Гарама",price:48,img:"./assets/cases/garama.png",pool:ITEMS.filter(i=>i.price>=30&&i.price<=95)},
      {id:"cosmo",name:"Космо",price:54,img:"./assets/cases/cosmo.png",pool:ITEMS.filter(i=>i.price>=34&&i.price<=98)},
      {id:"hacker",name:"Хакер",price:44,img:"./assets/cases/hacker.png",pool:ITEMS.filter(i=>i.price>=23&&i.price<=84)},
      {id:"noobini",name:"Нубини",price:19,img:"./assets/cases/noobini.png",pool:ITEMS.filter(i=>i.price<=37)},
      {id:"slaps",name:"Слэпы",price:26,img:"./assets/cases/slaps.png",pool:ITEMS.filter(i=>i.price>=24&&i.price<=60)}
    ];

    const cache = {};
    const fb = n => `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="90" height="90"><rect width="90" height="90" rx="14" fill="%23151a27" stroke="%2300f0ff" stroke-width="2"/><text x="45" y="52" font-family="sans-serif" font-size="22" font-weight="bold" fill="%2300f0ff" text-anchor="middle">${(n||'BR').slice(0,2).toUpperCase()}</text></svg>`;
    const itemImg = it => cache[it.id] || `./assets/items/${it.id}.png`;

    async function fetchWiki() {
      try {
        const r = await fetch(`https://stealabrainrot.fandom.com/api.php?action=query&titles=${encodeURIComponent(ITEMS.map(i=>i.name).join('|'))}&prop=pageimages&format=json&pithumbsize=220&origin=*`);
        const d = await r.json();
        Object.values(d?.query?.pages||{}).forEach(p=>{ if(p.thumbnail?.source){ const f=ITEMS.find(i=>i.name.toLowerCase()===p.title.toLowerCase()); if(f) cache[f.id]=p.thumbnail.source; }});
        renderInv(); if(st.activeCase) openCaseScreen(st.activeCase);
      } catch(_){}
    }

    const uid = tg?.initDataUnsafe?.user?.id || 'guest';
    const KEY = `sab_tg_${uid}`;
    const st = { bal:300, inv:[], activeCase:null, mult:1, caseFast:false, upgFast:false, sIdx:null, target:null, queue:[], busy:false, rot:0 };

    function save(){ try{ localStorage.setItem(KEY, JSON.stringify({bal:st.bal,inv:st.inv})); }catch(_){} }
    function load(){ try{ const d=JSON.parse(localStorage.getItem(KEY)); if(d){st.bal=Number(d.bal)??300; st.inv=Array.isArray(d.inv)?d.inv:[];} }catch(_){} setBal(st.bal); }
    function setBal(v){ st.bal=Math.max(0,Math.round(v)); document.getElementById('bal').textContent=st.bal.toLocaleString('ru-RU'); save(); }

    function tab(id, b){
      if(st.busy) return;
      document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
      document.querySelectorAll('.nbtn').forEach(x=>x.classList.remove('on'));
      document.getElementById(`v-${id}`).classList.add('active'); b.classList.add('on');
      if(id==='upg') drawRing(getPct(), '#ff7b00');
    }

    function renderCases(){
      document.getElementById('case-screen').style.display='none';
      const g = document.getElementById('cases-grid'); g.style.display='grid'; g.innerHTML='';
      st.activeCase = null;
      CASES.forEach(c=>{
        const el = document.createElement('div'); el.className='c-card'; el.onclick=()=>openCaseScreen(c.id);
        el.innerHTML=`<img src="${c.img}" onerror="this.onerror=null;this.src='${fb(c.name)}'" alt=""><div class="c-name">${c.name}</div><div class="c-pr"><img src="./assets/coin.png" onerror="this.style.display='none'" alt="">${c.price}</div>`;
        g.appendChild(el);
      });
    }

    function openCaseScreen(id){
      const c = CASES.find(x=>x.id===id); if(!c) return;
      st.activeCase = id; st.mult = 1;
      document.getElementById('cases-grid').style.display='none';
      const scr = document.getElementById('case-screen'); scr.style.display='block';
      const bgImgs = Array.from({length:12},(_,i)=>`<img src="${itemImg(c.pool[i%c.pool.length])}" onerror="this.style.display='none'" alt="">`).join('');
      const dropsHtml = c.pool.map(it=>`<div class="d-item"><img src="${itemImg(it)}" onerror="this.onerror=null;this.src='${fb(it.name)}'" alt=""><div class="d-n">${it.name}</div><div class="d-p"><img class="coin-ic" src="./assets/coin.png" onerror="this.style.display='none'" alt="">${it.price}</div></div>`).join('');
      scr.innerHTML=`
        <div class="box-stage">
          <div class="bg-spin">${bgImgs}</div>
          <div class="stage-in">
            <div style="align-self:flex-start;"><button type="button" class="chip" onclick="renderCases()">← Кейсы</button></div>
            <img class="stage-hero" src="${c.img}" onerror="this.onerror=null;this.src='${fb(c.name)}'" alt="">
            <div class="h1" style="margin-bottom:10px;">${c.name}</div>
            <div class="row-btns">
              ${[1,3,5].map(m=>`<button type="button" class="chip m-b ${m===1?'on':''}" onclick="setMult(${m},this)">x${m}</button>`).join('')}
              <button type="button" id="c-fast-b" class="chip ${st.caseFast?'on':''}" onclick="toggleCaseFast()">⚡ Фаст</button>
            </div>
            <button type="button" id="c-open-b" class="btn" onclick="runCase()">Открыть за <span id="c-sum">${c.price}</span></button>
            <div class="drop-list">${dropsHtml}</div>
          </div>
        </div>`;
    }

    function setMult(m, b){ if(st.busy)return; st.mult=m; document.querySelectorAll('.m-b').forEach(x=>x.classList.remove('on')); b.classList.add('on'); const c=CASES.find(x=>x.id===st.activeCase); if(c) document.getElementById('c-sum').textContent=c.price*m; }
    function toggleCaseFast(){ st.caseFast=!st.caseFast; const b=document.getElementById('c-fast-b'); if(b) b.classList.toggle('on',st.caseFast); }

    function pickFair(pool){
      const w = pool.map(i=>1/Math.pow(i.price,1.15));
      let r = Math.random()*w.reduce((a,b)=>a+b,0);
      for(let i=0;i<pool.length;i++){ if(r<w[i])return pool[i]; r-=w[i]; }
      return pool[0];
    }

    function runCase(){
      if(st.busy) return;
      const c = CASES.find(x=>x.id===st.activeCase); if(!c) return;
      const cost = c.price*st.mult;
      if(st.bal<cost){ alert('Недостаточно монет'); return; }
      st.busy=true; setBal(st.bal-cost);
      const btn=document.getElementById('c-open-b'); if(btn) btn.disabled=true;

      const wins = Array.from({length:st.mult},()=>pickFair(c.pool));
      if(st.caseFast){ st.busy=false; if(btn) btn.disabled=false; st.queue=wins; nextDrop(); return; }

      const mod=document.getElementById('m-reel'), box=document.getElementById('reel-box');
      box.innerHTML=''; mod.classList.add('open');
      const tracks=[];
      wins.forEach(win=>{
        const wrap=document.createElement('div'); wrap.className='r-line-wrap';
        wrap.innerHTML='<div class="r-mid"></div><div class="r-tr"></div>';
        const tr=wrap.querySelector('.r-tr');
        for(let i=0;i<64;i++){
          const it=i===54?win:pickFair(c.pool);
          const el=document.createElement('div'); el.className='r-it';
          el.innerHTML=`<img src="${itemImg(it)}" onerror="this.onerror=null;this.src='${fb(it.name)}'" alt="">`;
          tr.appendChild(el);
        }
        box.appendChild(wrap); tracks.push(tr);
      });
      void box.offsetWidth;
      const w=box.clientWidth||360, target=54*104-(w/2-52)+(Math.random()-.5)*64;
      requestAnimationFrame(()=>tracks.forEach(tr=>{ tr.style.transition='transform 7s cubic-bezier(.08,.85,.14,1)'; tr.style.transform=`translate3d(-${target}px,0,0)`; }));
      setTimeout(()=>{ mod.classList.remove('open'); st.busy=false; if(btn)btn.disabled=false; st.queue=wins; nextDrop(); },7150);
    }

    function nextDrop(){
      const it=st.queue.shift(); if(!it) return;
      document.getElementById('d-img').src=itemImg(it);
      document.getElementById('d-img').onerror=function(){this.onerror=null;this.src=fb(it.name);};
      document.getElementById('d-name').textContent=it.name;
      document.getElementById('d-pr').textContent=it.price;
      document.getElementById('d-sell').textContent=`Продать за ${it.price}`;
      document.getElementById('m-drop').dataset.cur=JSON.stringify(it);
      document.getElementById('m-drop').classList.add('open');
    }

    function takeDrop(act){
      const m=document.getElementById('m-drop'); m.classList.remove('open');
      const it=JSON.parse(m.dataset.cur||'null'); if(!it) return;
      if(act==='sell') setBal(st.bal+it.price); else { st.inv.push(it); renderInv(); save(); }
      setTimeout(nextDrop, 140);
    }

    function renderInv(){
      const g=document.getElementById('inv-grid'); g.innerHTML='';
      if(!st.inv.length){ g.innerHTML='<div style="grid-column:1/-1;text-align:center;color:var(--mu);padding:32px 0;font-size:13px;">Инвентарь пуст</div>'; return; }
      st.inv.forEach((it,i)=>{
        const el=document.createElement('div'); el.className='inv-c';
        el.innerHTML=`<img src="${itemImg(it)}" onerror="this.onerror=null;this.src='${fb(it.name)}'" alt=""><div class="d-n">${it.name}</div><div class="d-p"><img class="coin-ic" src="./assets/coin.png" onerror="this.style.display='none'" alt="">${it.price}</div><button type="button" class="sell-b" onclick="sellInv(${i})">Продать за ${it.price}</button>`;
        g.appendChild(el);
      });
    }

    function sellInv(i){ if(st.busy)return; const it=st.inv[i]; if(!it)return; setBal(st.bal+it.price); st.inv.splice(i,1); if(st.sIdx===i){st.sIdx=null;st.target=null;} else if(st.sIdx!==null&&st.sIdx>i)st.sIdx--; renderInv(); updUpg(); }

    function drawRing(pct, col='#ff7b00'){
      const c=document.getElementById('w-cvs'), ctx=c.getContext('2d'), cx=300, cy=300; ctx.clearRect(0,0,600,600);
      for(let i=0;i<72;i++){ const a=(i/72)*Math.PI*2-Math.PI/2, maj=i%18===0, r1=290, r2=r1-(maj?18:10); ctx.beginPath(); ctx.moveTo(cx+Math.cos(a)*r2,cy+Math.sin(a)*r2); ctx.lineTo(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1); ctx.strokeStyle=maj?'rgba(255,255,255,.45)':'rgba(255,255,255,.14)'; ctx.lineWidth=maj?3:2; ctx.stroke(); }
      const r=226, w=52; ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.strokeStyle='#121622'; ctx.lineWidth=w; ctx.stroke();
      if(pct>0){ ctx.save(); ctx.beginPath(); ctx.arc(cx,cy,r,-Math.PI/2,-Math.PI/2+(pct/100)*Math.PI*2); ctx.strokeStyle=col; ctx.lineWidth=w; ctx.shadowColor=col; ctx.shadowBlur=22; ctx.stroke(); ctx.restore(); }
    }

    function getPct(){ if(st.sIdx===null||!st.inv[st.sIdx]||!st.target)return 0; return Math.max(1,Math.min(75,Number(((st.inv[st.sIdx].price/st.target.price)*100).toFixed(2)))); }
    function toggleUpgFast(){ st.upgFast=!st.upgFast; document.getElementById('upg-fast').classList.toggle('on',st.upgFast); }

    function updUpg(){
      const s=st.sIdx!==null?st.inv[st.sIdx]:null, ss=document.getElementById('sl-s'), ts=document.getElementById('sl-t');
      ss.classList.toggle('on',!!s); ss.innerHTML=s?`<img src="${itemImg(s)}" onerror="this.onerror=null;this.src='${fb(s.name)}'" alt=""><div class="slot-t">${s.name}</div><div class="d-p">${s.price}</div>`:'<div class="slot-t">Выбрать ставку</div>';
      ts.classList.toggle('on',!!st.target); ts.innerHTML=st.target?`<img src="${itemImg(st.target)}" onerror="this.onerror=null;this.src='${fb(st.target.name)}'" alt=""><div class="slot-t">${st.target.name}</div><div class="d-p">${st.target.price}</div>`:'<div class="slot-t">Выбрать цель</div>';
      const p=getPct(); document.getElementById('w-pct').textContent=p.toFixed(2)+'%'; document.getElementById('w-pct').style.color='#fff';
      document.getElementById('w-st').textContent=p>0?'ШАНС ПРОКАЧКИ':'ВЫБЕРИТЕ СТАВКУ'; document.getElementById('upg-go').disabled=p<=0;
      drawRing(p,'#ff7b00');
    }

    function openPick(kind){
      if(st.busy)return; const list=document.getElementById('p-list'); list.innerHTML='';
      if(kind==='stake'){
        if(!st.inv.length){alert('Инвентарь пуст');return;}
        document.getElementById('p-title').textContent='Ставка из инвентаря';
        st.inv.forEach((it,i)=>{ const b=document.createElement('button'); b.type='button'; b.className='prow'; b.onclick=()=>{st.sIdx=i;if(st.target&&st.target.price<=it.price)st.target=null;closePick();updUpg();}; b.innerHTML=`<div class="prow-l"><img src="${itemImg(it)}" onerror="this.onerror=null;this.src='${fb(it.name)}'" alt=""><div><div class="d-n" style="height:auto;text-align:left;">${it.name}</div><div class="d-p">${it.price}</div></div></div>`; list.appendChild(b); });
      } else {
        const s=st.sIdx!==null?st.inv[st.sIdx]:null; if(!s){alert('Сначала выберите ставку');return;}
        const ts=ITEMS.filter(i=>i.price>s.price); if(!ts.length){alert('Нет целей дороже ставки');return;}
        document.getElementById('p-title').textContent='Цель прокачки';
        ts.forEach(it=>{ const pct=Math.max(1,Math.min(75,Number(((s.price/it.price)*100).toFixed(2)))); const b=document.createElement('button'); b.type='button'; b.className='prow'; b.onclick=()=>{st.target=it;closePick();updUpg();}; b.innerHTML=`<div class="prow-l"><img src="${itemImg(it)}" onerror="this.onerror=null;this.src='${fb(it.name)}'" alt=""><div><div class="d-n" style="height:auto;text-align:left;">${it.name}</div><div class="d-p">${it.price}</div></div></div><span class="pct-b">${pct.toFixed(1)}%</span>`; list.appendChild(b); });
      }
      document.getElementById('m-pick').classList.add('open');
    }
    function closePick(){ document.getElementById('m-pick').classList.remove('open'); }

    function spinUpg(){
      const p=getPct(); if(st.busy||p<=0)return; st.busy=true; document.getElementById('upg-go').disabled=true;
      const win=Math.random()*100<p, sec=(p/100)*360;
      const deg=win?Math.random()*Math.max(.5,sec-.5):sec+.5+Math.random()*Math.max(1,360-sec-1);
      const dur=st.upgFast?550:6500;
      st.rot=Math.floor(st.rot/360)*360+(st.upgFast?720:2160)+deg;
      const orb=document.getElementById('w-orb');
      orb.style.transition=`transform ${dur}ms cubic-bezier(.32,.02,.12,1)`;
      orb.style.transform=`rotate(${st.rot}deg)`;
      setTimeout(()=>{
        const pctEl=document.getElementById('w-pct'), stEl=document.getElementById('w-st');
        if(win){ pctEl.style.color='var(--ok)'; stEl.textContent='УСПЕХ'; stEl.style.color='var(--ok)'; drawRing(p,'#00f58d'); st.inv.splice(st.sIdx,1,st.target); }
        else { pctEl.style.color='var(--no)'; stEl.textContent='ПРОИГРЫШ'; stEl.style.color='var(--no)'; drawRing(p,'#ff2e55'); st.inv.splice(st.sIdx,1); }
        renderInv(); save();
        setTimeout(()=>{ st.sIdx=null; st.target=null; st.busy=false; stEl.style.color='var(--mu)'; updUpg(); }, st.upgFast?400:1100);
      }, dur+80);
    }

    load(); renderCases(); renderInv(); updUpg(); fetchWiki();
  </script>
</body>
</html>
